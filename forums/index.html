<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>def google classroom</title>

        <link rel="stylesheet" href="/styles/style.css" />
        <link rel="stylesheet" href="/styles/chatroom.css" />
        <link rel="stylesheet" href="./forum.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
        <script src="/theme.js"></script>
        <link rel="icon" type="image/png" href="/favicon.png" />
    </head>
    <body>
        <div id="particles-js"></div>
        <div id="styleSwitcher"></div>
        <div id="main-content">
            <header>
                <h1>Forums</h1>
                <p style="text-align: center; color: var(--color-fg-muted); margin-top: -20px;">still def google classroom guys</p>
            </header>
            <div id="name-auth-area"></div>
            <button id="create-post-btn" class="button-16" style="display: none; margin: 20px auto;">Create New Post</button>
            <section id="post-creator" style="display: none;">
                <h3>New Blog Entry</h3>
                <form id="post-form">
                    <div class="form-group"><label for="post-title">Title</label><input type="text" id="post-title" required /></div>
                    <div class="form-group"><label for="post-content">Content</label><textarea id="post-content" required></textarea></div>
                    <div class="form-group">
                        <label>Attach Image (Optional)</label>
                        <div id="image-upload-area">
                            <label for="file-input">Click to select or drag & drop an image</label>
                            <input type="file" id="file-input" accept="image/*">
                            <div id="image-preview-container"></div>
                            <progress id="upload-progress" value="0" max="100" style="display: none;"></progress>
                        </div>
                    </div>
                    <button type="submit" class="button-16">Publish Post</button>
                </form>
            </section>
            <hr class="rounded" />
            <div class="blog-grid" id="blog-grid"></div>
        </div>
        <div id="postModal" class="post-modal"><div class="post-modal-content" id="modal-body-content"></div></div>
        <div id="custom-alert-modal" class="modal">
            <div class="modal-content">
                <div class="alert-header">
                    <h3 id="alert-title">Alert</h3>
                    <span class="close-button" id="alert-close-button">&times;</span>
                </div>
                <div class="alert-body"><p id="alert-message">Message</p></div>
                <div class="alert-footer"><button id="alert-ok-button" class="alert-button">OK</button></div>
            </div>
        </div>
        <div id="custom-prompt-modal" class="modal">
            <div class="modal-content">
                <div class="alert-header">
                    <h3 id="prompt-title">Input</h3>
                    <span class="close-button" id="prompt-close-button">&times;</span>
                </div>
                <div class="alert-body">
                    <p id="prompt-message">Prompt</p>
                    <input type="password" id="prompt-input" />
                </div>
                <div class="alert-footer"><button id="prompt-cancel-button" class="alert-button secondary">Cancel</button><button id="prompt-ok-button" class="alert-button">OK</button></div>
            </div>
        </div>

        <div id="image-lightbox-modal" class="modal">
            <span class="close-button" id="lightbox-close-button">&times;</span>
            <img class="modal-content" id="lightbox-image">
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="forummain.js"></script>
    </body>
</html>
