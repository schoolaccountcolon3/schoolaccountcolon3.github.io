<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <style>
        :root {
            --background-color: #1a1a1a;
            --text-color: #f0f0f0;
            --bar-color: #6c757d;
            --highlight-color: #ffc107;
            --sorted-color: #28a745;
            --pivot-color: #dc3545;
            --eliminated-color: #343a40;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .controls label {
            font-size: 1.1em;
        }

        .controls input, .controls select, .controls button {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid var(--text-color);
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 1em;
            cursor: pointer;
        }
        
        .controls button:hover:not(:disabled) {
            background-color: #333;
        }

        .controls button:disabled, .controls input:disabled, .controls select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #sort-canvas {
            width: 90%;
            height: 60vh;
            border: 2px solid var(--text-color);
            background-color: #000;
        }
    </style>
</head>
<body>
    <h1>Sorting Algorithm Visualizer</h1>
    <div class="controls">
        <label for="n-input">n =</label>
        <input type="number" id="n-input" value="100" min="5" max="2000">
        <label for="algorithm-select">Algorithm:</label>
        <select id="algorithm-select">
            <optgroup label="Simple Sorts">
                <option value="bubbleSort">Bubble Sort</option>
                <option value="selectionSort">Selection Sort</option>
                <option value="insertionSort">Insertion Sort</option>
                <option value="gnomeSort">Gnome Sort</option>
            </optgroup>
            <optgroup label="Efficient Sorts">
                <option value="mergeSort">Merge Sort</option>
                <option value="quickSort">Quick Sort</option>
                <option value="heapSort">Heap Sort</option>
                <option value="shellSort">Shell Sort</option>
                <option value="combSort">Comb Sort</option>
            </optgroup>
            <optgroup label="Specialized & Fun">
                <option value="radixSort">Radix Sort</option>
                <option value="pancakeSort">Pancake Sort</option>
                <option value="cocktailShakerSort">Cocktail Shaker Sort</option>
                <option value="stalinSort">Stalin Sort</option>
                <option value="gravitySort">Gravity (Bead) Sort</option>
                <option value="sleepSort">Sleep Sort</option>
                <option value="bogoSort">Bogo Sort</option>
            </optgroup>
        </select>
        <button id="sort-btn">Sort</button>
        <button id="stop-btn" disabled>Stop</button>
        <button id="shuffle-btn">Shuffle</button>
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="1" max="200" value="150" title="Adjust animation speed">
    </div>
    <canvas id="sort-canvas"></canvas>

    <script>
        const canvas = document.getElementById('sort-canvas');
        const ctx = canvas.getContext('2d');
        const nInput = document.getElementById('n-input');
        const algorithmSelect = document.getElementById('algorithm-select');
        const sortBtn = document.getElementById('sort-btn');
        const stopBtn = document.getElementById('stop-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const speedSlider = document.getElementById('speed-slider');

        let array = [];
        let n = parseInt(nInput.value);
        let max_value;
        let audioCtx;
        let gainNode;
        let isSorting = false;
        let animationSpeed = 201 - parseInt(speedSlider.value);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.1;
                gainNode.connect(audioCtx.destination);
            }
        }

        function playTone(freq, duration = 100) {
            if (!isSorting && !audioCtx) return;
            initAudio();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => oscillator.stop(), duration);
        }

        function generateArray() {
            if (isSorting) return;
            n = parseInt(nInput.value);
            max_value = n; // The max value for scaling height is the initial n
            array = [];
            for (let i = 0; i < n; i++) {
                array.push(i + 1);
            }
            renderBars();
        }

        function shuffleArray() {
            if (isSorting) return;
            generateArray(); // Regenerate to reset n if Stalin Sort was used
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            renderBars();
        }

        function renderBars(highlightIndices = [], sortedIndices = [], pivotIndex = -1, eliminatedIndices = []) {
            // Match canvas internal resolution to its display size for clarity
            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = canvas.width / array.length;

            for (let i = 0; i < array.length; i++) {
                const barHeight = (array[i] / max_value) * canvas.height;

                // Set color with highlight priority
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bar-color').trim();
                if (eliminatedIndices.includes(i)) ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--eliminated-color').trim();
                if (sortedIndices.includes(i)) ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sorted-color').trim();
                if (pivotIndex === i) ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--pivot-color').trim();
                if (highlightIndices.includes(i)) ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--highlight-color').trim();
                
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth, barHeight);
            }
        }
        
        async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function toggleControls(enable) {
            nInput.disabled = !enable;
            algorithmSelect.disabled = !enable;
            sortBtn.disabled = !enable;
            shuffleBtn.disabled = !enable;
            stopBtn.disabled = enable;
        }
        
        async function playCompletionAnimation() {
            for (let i = 0; i < array.length; i++) {
                if (!isSorting) return;
                playTone(200 + array[i] * 3, 50);
                renderBars([i], Array.from({length: i + 1}, (_, k) => k));
                await sleep(Math.max(1, 500 / array.length));
            }
        }

        // --- SORTING ALGORITHMS ---

        async function bubbleSort() {
            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (!isSorting) return;
                    if (array[j] > array[j + 1]) {
                        [array[j], array[j + 1]] = [array[j + 1], array[j]];
                        playTone(200 + array[j] * 3);
                    }
                    renderBars([j, j + 1], Array.from({length: i}, (_, k) => n - 1 - k));
                    await sleep(animationSpeed);
                }
            }
        }

        async function stalinSort() {
            if (array.length === 0) return;
            let lastKeptValue = array[0];
            let eliminatedIndices = [];
            let keptIndices = [0];

            for (let i = 1; i < array.length; i++) {
                if (!isSorting) return;
                if (array[i] < lastKeptValue) {
                    eliminatedIndices.push(i);
                } else {
                    lastKeptValue = array[i];
                    keptIndices.push(i);
                }
                renderBars([i], keptIndices, -1, eliminatedIndices);
                playTone(200 + array[i] * 3);
                await sleep(animationSpeed);
            }
            if (!isSorting) return;
            // Filter the array to create the glorious new state-approved array
            array = array.filter((_, index) => !eliminatedIndices.includes(index));
            n = array.length; // The new n
        }

        // ... Other algorithm implementations (copy-pasted from previous version) ...
        async function selectionSort() { let sorted = []; for (let i = 0; i < n - 1; i++) { let minIdx = i; for (let j = i + 1; j < n; j++) { if (!isSorting) return; renderBars([i, j], sorted); await sleep(animationSpeed); if (array[j] < array[minIdx]) minIdx = j; } [array[i], array[minIdx]] = [array[minIdx], array[i]]; sorted.push(i); playTone(200 + array[i] * 3); } }
        async function insertionSort() { for (let i = 1; i < n; i++) { let key = array[i]; let j = i - 1; while (j >= 0 && array[j] > key) { if (!isSorting) return; array[j + 1] = array[j]; playTone(200 + array[j] * 3); renderBars([j, j + 1]); await sleep(animationSpeed); j = j - 1; } array[j + 1] = key; } }
        async function merge(l, m, r) { let n1 = m - l + 1, n2 = r - m, L = new Array(n1), R = new Array(n2); for (let i = 0; i < n1; i++) L[i] = array[l + i]; for (let j = 0; j < n2; j++) R[j] = array[m + 1 + j]; let i = 0, j = 0, k = l; while (i < n1 && j < n2) { if (!isSorting) return; renderBars([l + i, m + 1 + j]); await sleep(animationSpeed); if (L[i] <= R[j]) { array[k] = L[i]; playTone(200 + L[i] * 3); i++; } else { array[k] = R[j]; playTone(200 + R[j] * 3); j++; } k++; } while (i < n1) { if (!isSorting) return; array[k] = L[i]; playTone(200 + L[i] * 3); renderBars([k]); await sleep(animationSpeed); i++; k++; } while (j < n2) { if (!isSorting) return; array[k] = R[j]; playTone(200 + R[j] * 3); renderBars([k]); await sleep(animationSpeed); j++; k++; } }
        async function mergeSortRecursive(l, r) { if (l >= r || !isSorting) return; let m = l + parseInt((r - l) / 2); await mergeSortRecursive(l, m); await mergeSortRecursive(m + 1, r); if (!isSorting) return; await merge(l, m, r); }
        async function partition(low, high) { let pivot = array[high]; let i = low - 1; for (let j = low; j <= high - 1; j++) { if (!isSorting) return -1; renderBars([j, high], [], high); await sleep(animationSpeed); if (array[j] < pivot) { i++; [array[i], array[j]] = [array[j], array[i]]; playTone(200 + array[i] * 3); } } [array[i + 1], array[high]] = [array[high], array[i + 1]]; playTone(200 + array[i + 1] * 3); return i + 1; }
        async function quickSortRecursive(low, high) { if (low < high && isSorting) { let pi = await partition(low, high); if (!isSorting) return; await quickSortRecursive(low, pi - 1); if (!isSorting) return; await quickSortRecursive(pi + 1, high); } }
        async function heapify(heapSize, i) { if (!isSorting) return; let largest = i, l = 2 * i + 1, r = 2 * i + 2; if (l < heapSize && array[l] > array[largest]) largest = l; if (r < heapSize && array[r] > array[largest]) largest = r; if (largest != i) { [array[i], array[largest]] = [array[largest], array[i]]; playTone(200 + array[i] * 3); renderBars([i, largest]); await sleep(animationSpeed); await heapify(heapSize, largest); } }
        async function heapSort() { for (let i = Math.floor(n / 2) - 1; i >= 0; i--) { if (!isSorting) return; await heapify(n, i); } for (let i = n - 1; i > 0; i--) { if (!isSorting) return; [array[0], array[i]] = [array[i], array[0]]; playTone(200 + array[0] * 3); renderBars([0, i], Array.from({length: n - i}, (_, k) => n - 1 - k)); await sleep(animationSpeed); await heapify(i, 0); } }
        async function shellSort() { for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) { for (let i = gap; i < n; i++) { let temp = array[i], j; for (j = i; j >= gap && array[j - gap] > temp; j -= gap) { if (!isSorting) return; array[j] = array[j - gap]; playTone(200 + array[j] * 3); renderBars([j, j - gap]); await sleep(animationSpeed); } array[j] = temp; } } }
        async function cocktailShakerSort() { let swapped = true, start = 0, end = n - 1; while (swapped) { if (!isSorting) return; swapped = false; for (let i = start; i < end; ++i) { if (!isSorting) return; if (array[i] > array[i + 1]) { [array[i], array[i + 1]] = [array[i + 1], array[i]]; playTone(200 + array[i] * 3); swapped = true; renderBars([i, i + 1]); await sleep(animationSpeed); } } if (!swapped) break; swapped = false; --end; for (let i = end - 1; i >= start; --i) { if (!isSorting) return; if (array[i] > array[i + 1]) { [array[i], array[i + 1]] = [array[i + 1], array[i]]; playTone(200 + array[i] * 3); swapped = true; renderBars([i, i + 1]); await sleep(animationSpeed); } } ++start; } }
        async function gnomeSort() { let index = 0; while (index < n) { if (!isSorting) return; if (index == 0) index++; if (array[index] >= array[index - 1]) index++; else { [array[index], array[index - 1]] = [array[index - 1], array[index]]; playTone(200 + array[index] * 3); index--; } renderBars([index, index - 1]); await sleep(animationSpeed); } }
        async function combSort() { let gap = n, shrink = 1.3, swapped = true; while (gap > 1 || swapped) { if (!isSorting) return; gap = Math.floor(gap / shrink); if (gap < 1) gap = 1; swapped = false; for (let i = 0; i + gap < n; i++) { if (!isSorting) return; if (array[i] > array[i + gap]) { [array[i], array[i + gap]] = [array[i + gap], array[i]]; playTone(200 + array[i] * 3); swapped = true; } renderBars([i, i + gap]); await sleep(animationSpeed); } } }
        async function pancakeSort() { async function flip(k) { for(let left = 0; left < k; left++, k--) { if (!isSorting) return; [array[left], array[k]] = [array[k], array[left]]; playTone(200 + array[left] * 3); renderBars([left, k]); await sleep(animationSpeed); } } for (let currSize = n; currSize > 1; currSize--) { if (!isSorting) return; let maxIdx = 0; for (let i = 1; i < currSize; i++) if (array[i] > array[maxIdx]) maxIdx = i; if (maxIdx != currSize - 1) { await flip(maxIdx); await flip(currSize - 1); } } }
        async function radixSort() { const getMax = () => Math.max(...array); const countSort = async (exp) => { let output = new Array(n).fill(0), count = new Array(10).fill(0); for (let i = 0; i < n; i++) if (!isSorting) return; else count[Math.floor(array[i] / exp) % 10]++; for (let i = 1; i < 10; i++) count[i] += count[i - 1]; for (let i = n - 1; i >= 0; i--) { if (!isSorting) return; output[count[Math.floor(array[i] / exp) % 10] - 1] = array[i]; count[Math.floor(array[i] / exp) % 10]--; } for (let i = 0; i < n; i++) { if (!isSorting) return; array[i] = output[i]; playTone(200 + array[i] * 3); renderBars([i]); await sleep(animationSpeed); } }; let m = getMax(); for (let exp = 1; Math.floor(m / exp) > 0; exp *= 10) { if (!isSorting) return; await countSort(exp); } }
        async function bogoSort() { if (n > 10) { alert("Bogo Sort is not recommended for n > 10."); return; } const isSorted = () => { for (let i = 1; i < n; i++) if (array[i] < array[i - 1]) return false; return true; }; while (!isSorted()) { if (!isSorting) return; for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } renderBars(); await sleep(animationSpeed); } }

        async function sleepSort() {
            if (n > 200) {
                alert("Sleep Sort is very slow and creates many timers. Not recommended for n > 200.");
                return;
            }
            let sorted_array = [];
            let promises = [];
            const delayMultiplier = animationSpeed > 0 ? animationSpeed / 4 : 0.25;

            for (let i = 0; i < n; i++) {
                let val = array[i];
                const promise = new Promise(resolve => {
                    setTimeout(() => {
                        if (isSorting) {
                            sorted_array.push(val);
                            // Copy partially sorted data to main array for rendering
                            for (let k = 0; k < sorted_array.length; k++) {
                                array[k] = sorted_array[k];
                            }
                            // Fill the rest with 0 to show progress
                            for (let k = sorted_array.length; k < n; k++) {
                                array[k] = 0;
                            }
                            renderBars([sorted_array.length - 1], Array.from({length: sorted_array.length}, (_, k) => k));
                            playTone(200 + val * 3);
                        }
                        resolve();
                    }, val * delayMultiplier);
                });
                promises.push(promise);
            }
            await Promise.all(promises);
            if (isSorting) {
                array = sorted_array;
            }
        }

        async function gravitySort() {
            let max_val = 0;
            for (let i = 0; i < n; i++) {
                if (array[i] > max_val) max_val = array[i];
            }
            if (max_val > 1000 || n > 1000) {
                alert("Gravity Sort is not suitable for very large numbers or array sizes in this visualizer.");
                return;
            }

            let beads_per_column = new Array(max_val).fill(0);

            // Step 1: Drop beads into columns
            for (let i = 0; i < n; i++) {
                if (!isSorting) return;
                for (let j = 0; j < array[i]; j++) {
                    beads_per_column[j]++;
                }
                renderBars([i]);
                await sleep(animationSpeed);
            }

            // Step 2: Let beads settle and reconstruct the array
            array.fill(0);
            renderBars();
            await sleep(animationSpeed * 2);

            for (let j = 0; j < max_val; j++) {
                if (!isSorting) return;
                let beads_in_this_col = beads_per_column[j];
                for (let i = n - beads_in_this_col; i < n; i++) {
                    array[i]++;
                }
                renderBars([], [], j); // Highlight the "column" being processed
                await sleep(animationSpeed);
            }
        }

        // --- ALGORITHM MAPPING & EVENT LISTENERS ---

        const sortingAlgorithms = {
            bubbleSort, selectionSort, insertionSort, cocktailShakerSort, shellSort,
            mergeSort: async () => await mergeSortRecursive(0, n - 1),
            quickSort: async () => await quickSortRecursive(0, n - 1),
            heapSort, gnomeSort, combSort, pancakeSort, radixSort, bogoSort, stalinSort,
            sleepSort, gravitySort
        };
        
        sortBtn.addEventListener('click', async () => {
            if (isSorting) return;
            isSorting = true;
            toggleControls(false);
            const selectedAlgorithm = algorithmSelect.value;
            // Pre-run check for Bogo Sort
            if (selectedAlgorithm === "bogoSort" && n > 10) { bogoSort(); isSorting = false; toggleControls(true); return; }
            
            try {
                await sortingAlgorithms[selectedAlgorithm]();
                if (isSorting) { 
                    await playCompletionAnimation();
                    if (isSorting) {
                        renderBars([], Array.from({length: array.length}, (_, k) => k));
                    }
                }
            } catch (error) {
                console.error("Error during sorting:", error);
            } finally {
                isSorting = false;
                toggleControls(true);
            }
        });

        stopBtn.addEventListener('click', () => { isSorting = false; });
        shuffleBtn.addEventListener('click', () => { if (!isSorting) shuffleArray(); });
        nInput.addEventListener('change', () => { if (!isSorting) generateArray(); });
        speedSlider.addEventListener('input', (e) => { animationSpeed = 201 - parseInt(e.target.value); });
        
        window.onload = shuffleArray;
        window.onresize = () => { if (!isSorting) renderBars(); };
    </script>
</body>
</html>
