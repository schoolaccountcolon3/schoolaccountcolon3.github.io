<html>

  <head>
    <script src="//www.google.com/jsapi"></script>
    <script>
      window.parent.maeExportApis_();
    </script>

    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin-top: 0;
        margin-left: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(100px);
        }

        90% {
          transform: translateX(100px);
        }

        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading: 0/0</div>
      <div id="first-time">First-time loading may take longer...</div>
    </div>
    <script>
      document.getElementById("loading-progress").remove();
      document.getElementById("first-time").remove();
      EJS_player = "#game";
      EJS_core = "gba";
      EJS_gameName = "toomanytypes2";
      EJS_color = "#000000";
      EJS_startOnLoaded = true;
      EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
      EJS_gameUrl =
        "https://cdn.jsdelivr.net/gh/lemonsky47/roms@main/gba/Pokemon%20Too%20Many%20Types%202%20v1.5.2.zip";
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
      document.body.appendChild(script);
    </script>
  </body>
</html>
