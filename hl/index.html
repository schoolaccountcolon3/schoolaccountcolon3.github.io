<!DOCTYPE html>
<html lang="en-us">
	<head>
		<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="MobileOptimized" content="640"/>
		<meta name="HandheldFriendly" content="true"/>
		<title>Half-Life</title>
		<link rel="stylesheet" href="/styles/style.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<script src="/theme.js"></script>
		<script>
		document.addEventListener('contextmenu', event => event.preventDefault());
		</script>
		<style>
			body {
				background-color: var(--color-bg);
				color: var(--color-fg);
				font-family: var(--font-main);
				margin: 0;
				padding: 20px;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}

			.hl-container {
				max-width: 600px;
				width: 100%;
				background: var(--color-card-bg);
				border-radius: 16px;
				padding: 40px;
				box-shadow: 0 8px 32px var(--color-shadow);
				border: 1px solid rgba(255, 255, 255, 0.1);
				text-align: center;
			}

			.hl-title {
				font-size: 2.5em;
				font-weight: 700;
				color: #fff;
				margin-bottom: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 15px;
			}

			.hl-title i {
				color: var(--color-primary);
				animation: pulse 2s infinite;
			}

			.hl-subtitle {
				color: var(--color-fg-muted);
				font-size: 1.1em;
				margin-bottom: 30px;
			}

			.hl-link {
				color: var(--color-link);
				text-decoration: none;
				font-weight: 600;
				transition: color 0.3s ease;
			}

			.hl-link:hover {
				color: var(--color-link-hover);
			}

			.settings-section {
				margin: 30px 0;
				padding: 25px;
				background: var(--color-bg);
				border-radius: 12px;
				border: 1px solid var(--color-border);
			}

			.settings-title {
				font-size: 1.3em;
				font-weight: 600;
				color: #fff;
				margin-bottom: 20px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
			}

			.form-group {
				margin-bottom: 20px;
				text-align: left;
			}

			.form-group label {
				display: block;
				margin-bottom: 8px;
				color: var(--color-fg);
				font-weight: 500;
			}

			.form-group input[type="number"] {
				width: 100%;
				padding: 12px 16px;
				border: 1px solid var(--color-border);
				border-radius: 8px;
				background: var(--color-input-bg);
				color: var(--color-fg);
				font-family: var(--font-main);
				font-size: 1em;
				transition: border-color 0.3s ease, box-shadow 0.2s ease;
				box-sizing: border-box;
			}

			.form-group input[type="number"]:focus {
				outline: none;
				border-color: var(--color-primary);
				box-shadow: 0 0 5px var(--color-focus);
			}

			.start-button {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				width: 100%;
				padding: 16px 32px;
				font-size: 1.2em;
				font-weight: 600;
				color: #fff;
				background: var(--color-button-bg);
				border: none;
				border-radius: 12px;
				cursor: pointer;
				box-shadow: 0 4px 12px var(--color-inset-shadow);
				transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
				margin-top: 20px;
			}

			.start-button:hover {
				background: var(--color-button-hover);
				transform: translateY(-3px);
				box-shadow: 0 8px 25px var(--color-inset-shadow);
			}

			.start-button:active {
				transform: translateY(-1px);
			}

			.back-link {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				margin-top: 30px;
				padding: 12px 24px;
				color: var(--color-link);
				text-decoration: none;
				font-weight: 500;
				border: 1px solid var(--color-border);
				border-radius: 8px;
				transition: all 0.3s ease;
			}

			.back-link:hover {
				color: var(--color-link-hover);
				background: var(--color-button-hover);
				transform: translateY(-2px);
			}

			@keyframes pulse {
				0%, 100% { transform: scale(1); }
				50% { transform: scale(1.1); }
			}

			@media (max-width: 768px) {
				.hl-container {
					padding: 30px 20px;
				}
				
				.hl-title {
					font-size: 2em;
					flex-direction: column;
					gap: 10px;
				}
			}
		</style>
	</head>

<body>
	<div id="styleSwitcher"></div>
	<div class="hl-container">
		<h1 class="hl-title">
			<i class="fas fa-crosshairs"></i>
			Half-Life
		</h1>
		<p class="hl-subtitle">
			<a href="https://github.com/FWGS/xash3d/" class="hl-link" target="_blank">
				<i class="fas fa-external-link-alt"></i> Xash3D FWGS
			</a> 
			Emscripten port
		</p>

		<div class="settings-section">
			<h2 class="settings-title">
				<i class="fas fa-cog"></i>
				Game Settings
			</h2>
			<form>
				<div class="form-group">
					<label for="mem">
						<i class="fas fa-memory"></i>
						Memory Size (MB):
					</label>
					<input type="number" value="150" id="mem" min="64" max="512" step="16">
				</div>
				<button type="button" class="start-button" onclick="startGame()">
					<i class="fas fa-play"></i>
					Start Half-Life
				</button>
			</form>
		</div>

		<a href="../index.html" class="back-link">
			<i class="fas fa-arrow-left"></i>
			Back to Games
		</a>
	</div>

	<script>
		var a = new Audio('music.mp3');
		var pashalka_count = 0;

		function play_sound(){
			if(pashalka_count==10) a.play();
			pashalka_count+=1;
		}

		function startGame() {
			const memValue = document.getElementById('mem').value;
			window.location.href = "xash.html#" + memValue;
		}

		window.addEventListener('click', play_sound);
		window.addEventListener('keydown', play_sound);
	</script>
</body>
</html>
