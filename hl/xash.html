<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="MobileOptimized" content="640" />
	<meta name="HandheldFriendly" content="true" />
	<title>Half-Life</title>
	<link rel="stylesheet" href="../styles/style.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<script>
		document.addEventListener('contextmenu', event => event.preventDefault());
		window.onbeforeunload = function(e) {
			// Cancel the event
			e.preventDefault();

			// Chrome requires returnValue to be set
			e.returnValue = 'Really want to quit the game?';
		};

		//Prevent Ctrl+S (and Ctrl+W for old browsers and Edge)
		document.onkeydown = function(e) {
			e = e || window.event; //Get event

			if (!e.ctrlKey) return;

			var code = e.which || e.keyCode; //Get key code

			switch (code) {
				case 83: //Block Ctrl+S
				case 87: //Block Ctrl+W -- Not work in Chrome and new Firefox
					e.preventDefault();
					e.stopPropagation();
					break;
			}
		};
	</script>
	<style>
		body {
			font-family: var(--font-main);
			margin: 0;
			padding: 0;
			background-color: var(--color-bg);
			color: var(--color-fg);
			overflow-x: hidden;
		}

		.game-header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 1000;
			background: var(--color-card-bg);
			padding: 15px 20px;
			border-bottom: 1px solid var(--color-border);
			display: flex;
			justify-content: space-between;
			align-items: center;
			backdrop-filter: blur(10px);
			box-shadow: 0 2px 10px var(--color-shadow);
		}

		.game-title {
			font-size: 1.3em;
			font-weight: 600;
			color: #fff;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.game-controls {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.control-button {
			padding: 8px 16px;
			background: var(--color-button-bg);
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-size: 0.9em;
			transition: all 0.3s ease;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.control-button:hover {
			background: var(--color-button-hover);
			transform: translateY(-1px);
		}

		.emscripten {
			padding-right: 0;
			margin-left: auto;
			margin-right: auto;
			display: block;
			margin-top: 70px;
		}

		div.emscripten {
			text-align: center;
		}

		div.emscripten_border {
			text-align: center;
			margin-top: 70px;
		}

		/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
		canvas.emscripten {
			border: 0px none;
			background-image: url(xd.png);
			box-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
			max-width: 100vw;
			max-height: 100vh;
		}

		/* Fullscreen canvas adjustments */
		canvas.emscripten:fullscreen {
			width: 100vw !important;
			height: 100vh !important;
			max-width: none;
			max-height: none;
		}

		/* Fullscreen container adjustments */
		.emscripten_border:fullscreen {
			margin: 0 !important;
			padding: 0 !important;
			width: 100vw !important;
			height: 100vh !important;
			display: flex !important;
			justify-content: center !important;
			align-items: center !important;
		}

		/* Pointer lock handling */
		canvas.emscripten:focus {
			outline: none;
		}

		@-webkit-keyframes rotation {
			from {
				-webkit-transform: rotate(0deg);
			}

			to {
				-webkit-transform: rotate(360deg);
			}
		}

		@-moz-keyframes rotation {
			from {
				-moz-transform: rotate(0deg);
			}

			to {
				-moz-transform: rotate(360deg);
			}
		}

		@-o-keyframes rotation {
			from {
				-o-transform: rotate(0deg);
			}

			to {
				-o-transform: rotate(360deg);
			}
		}

		@keyframes rotation {
			from {
				transform: rotate(0deg);
			}

			to {
				transform: rotate(360deg);
			}
		}

		#controls {
			position: fixed;
			top: 70px;
			right: 20px;
			z-index: 999;
			background: var(--color-card-bg);
			padding: 15px;
			border-radius: 12px;
			border: 1px solid var(--color-border);
			box-shadow: 0 4px 12px var(--color-shadow);
			display: flex;
			flex-direction: column;
			gap: 10px;
			min-width: 200px;
		}

		#controls label {
			display: flex;
			align-items: center;
			gap: 8px;
			color: var(--color-fg);
			font-size: 0.9em;
			cursor: pointer;
			transition: color 0.3s ease;
		}

		#controls label:hover {
			color: var(--color-primary);
		}

		#controls input[type="checkbox"] {
			margin: 0;
		}

		#controls input[type="button"] {
			padding: 8px 12px;
			background: var(--color-button-bg);
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 0.9em;
			transition: all 0.3s ease;
			width: 100%;
		}

		#controls input[type="button"]:hover {
			background: var(--color-button-hover);
			transform: translateY(-1px);
		}

		#output {
			width: 100%;
			height: 200px;
			margin: 0 auto;
			margin-top: 10px;
			border-left: 0px;
			border-right: 0px;
			border-style: solid;
			padding-left: 0px;
			padding-right: 0px;
			display: none;
			background-color: black;
			color: rgba(0, 255, 0, 255);
			font-family: 'Lucida Console', Monaco, monospace;
			outline: none;
			border-color: var(--color-primary);
		}

		.loader {
			border: 4px solid var(--color-border);
			border-radius: 50%;
			border-top: 4px solid var(--color-primary);
			width: 16px;
			height: 16px;
			-webkit-animation: spin 2s linear infinite;
			/* Safari */
			animation: spin 2s linear infinite;
		}

		/* Safari */
		@-webkit-keyframes spin {
			0% {
				-webkit-transform: rotate(0deg);
			}

			100% {
				-webkit-transform: rotate(360deg);
			}
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		a.glow,
		a.glow:hover,
		a.glow:focus {
			text-decoration: none;
			color: var(--color-link);
			text-shadow: none;
			-webkit-transition: 500ms linear 0s;
			-moz-transition: 500ms linear 0s;
			-o-transition: 500ms linear 0s;
			transition: 500ms linear 0s;
			outline: 0 none;
			cursor: default;
		}

		a.glow:hover,
		a.glow:focus {
			color: var(--color-link-hover);
			text-shadow: -1px 1px 8px var(--color-primary), 1px -1px 8px var(--color-primary);
		}

		input[type="button"i],
		#label_file_select {
			color: var(--color-fg);
			background-color: var(--color-button-bg);
			border: 2px solid var(--color-primary);
			border-radius: 8px;
			font-family: var(--font-main);
			font-size: 16px;
			transition: 0.3s all;
			padding: 8px 16px;
		}

		hr {
			border-color: var(--color-primary);
		}

		input[type="button"i]:hover,
		#label_file_select:hover {
			color: var(--color-bg);
			background-color: var(--color-primary);
			transform: translateY(-1px);
		}

		#label_file_select {
			padding: 8px 16px;
			cursor: pointer;
		}

		input[type="file"i] {
			display: none;
		}

		input[type="text"i] {
			color: var(--color-fg);
			background-color: var(--color-input-bg);
			border: 2px solid var(--color-border);
			border-radius: 8px;
			font-family: var(--font-main);
			font-size: 14px;
			transition: 0.3s all;
			padding: 8px 12px;
		}

		input[type="text"i]:focus {
			border-color: var(--color-primary);
			outline: none;
		}

		* {
			cursor: default;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			outline: none;
		}

		audio{
			display: none;
		}

		/* Game Options Panel */
		#optionsTitle {
			background: var(--color-card-bg);
			padding: 20px;
			border-radius: 12px;
			margin: 20px;
			border: 1px solid var(--color-border);
			text-align: center;
		}

		#optionsTitle h1 {
			color: #fff;
			margin: 0;
			font-size: 1.5em;
		}

		#fSettings {
			background: var(--color-card-bg);
			padding: 25px;
			border-radius: 12px;
			margin: 20px;
			border: 1px solid var(--color-border);
			color: var(--color-fg);
		}

		#fSettings label {
			display: flex;
			align-items: center;
			gap: 8px;
			margin: 8px 0;
			cursor: pointer;
			padding: 8px 12px;
			border-radius: 6px;
			transition: background-color 0.3s ease;
		}

		#fSettings label:hover {
			background: var(--color-button-hover);
		}

		#fSettings input[type="radio"] {
			margin: 0;
		}

		#fSettings select {
			background: var(--color-input-bg);
			color: var(--color-fg);
			border: 1px solid var(--color-border);
			border-radius: 6px;
			padding: 6px 12px;
			margin: 5px 0;
			font-family: var(--font-main);
		}

		#fSettings hr {
			margin: 15px 0;
			border-color: var(--color-border);
		}

		#fSettings input[type="text"] {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid var(--color-border);
			border-radius: 6px;
			background: var(--color-input-bg);
			color: var(--color-fg);
			font-family: var(--font-main);
			margin: 8px 0;
			box-sizing: border-box;
		}

		#fSettings input[type="text"]:focus {
			border-color: var(--color-primary);
			outline: none;
		}

		#fSettings input[type="button"] {
			width: 100%;
			padding: 12px;
			background: var(--color-button-bg);
			color: white;
			border: none;
			border-radius: 8px;
			font-family: var(--font-main);
			font-size: 1em;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			margin-top: 15px;
		}

		#fSettings input[type="button"]:hover {
			background: var(--color-button-hover);
			transform: translateY(-1px);
		}

		#fSettings .section-title {
			font-weight: 600;
			color: #fff;
			margin: 15px 0 10px 0;
			font-size: 1.1em;
		}

		#fSettings .option-group {
			margin: 10px 0;
		}

		/* Status and Progress */
		#status {
			color: var(--color-fg);
			font-weight: 500;
			position: fixed;
			top: 70px;
			left: 20px;
			z-index: 999;
			background: var(--color-card-bg);
			padding: 10px 15px;
			border-radius: 8px;
			border: 1px solid var(--color-border);
			box-shadow: 0 2px 8px var(--color-shadow);
		}

		#progress1 {
			position: fixed;
			top: 110px;
			left: 20px;
			z-index: 999;
			width: 200px;
			height: 20px;
			background: var(--color-bg);
			border: 2px solid var(--color-primary);
			border-radius: 6px;
			overflow: hidden;
			display: none;
		}

		#progress {
			background: var(--color-primary);
			color: var(--color-bg);
			text-align: center;
			height: 100%;
			transition: width 0.3s ease;
			line-height: 16px;
			font-size: 0.8em;
			font-weight: 600;
		}

		/* Responsive Design */
		@media (max-width: 768px) {
			.game-header {
				padding: 10px 15px;
			}

			.game-title {
				font-size: 1.1em;
			}

			.control-button {
				padding: 6px 12px;
				font-size: 0.8em;
			}

			#controls {
				top: 60px;
				right: 10px;
				min-width: 180px;
			}

			#status {
				top: 60px;
				left: 10px;
				font-size: 0.9em;
			}

			#progress1 {
				top: 100px;
				left: 10px;
				width: 150px;
			}

			#fSettings {
				margin: 10px;
				padding: 20px;
			}
		}
	</style>
</head>

<body onerror=alert(event);>
	<div class="game-header">
		<div class="game-title">
			<i class="fas fa-crosshairs"></i>
			Half-Life
		</div>
		<div class="game-controls">
			<button class="control-button" onclick="location.href='index.html'">
				<i class="fas fa-arrow-left"></i>
				Back
			</button>
			<button class="control-button" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
				<i class="fas fa-expand"></i>
				Fullscreen
			</button>
		</div>
	</div>

	<div class="emscripten_border">
		<canvas style="display:none" class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	</div>

	<div id="status">Downloading...</div>
	<div id="progress1">
		<div id="progress"></div>
	</div>

	<div class="loader" id="loader1"></div>

	<div id="controls">
		<label id="label_show_console_log">
			<input type="checkbox" id="show_console_log" checked>
			<i class="fas fa-terminal"></i>
			Show Console Log
		</label>
		<label>
			<input type="checkbox" id="resize">
			<i class="fas fa-expand-arrows-alt"></i>
			Resize Canvas
		</label>
		<label>
			<input type="checkbox" id="pointerLock" checked>
			<i class="fas fa-mouse-pointer"></i>
			Lock Mouse Pointer
		</label>
		<input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
	</div>

	<textarea id="output" rows="8" style="display: none;"></textarea>
	<div id="asyncDialog" style="float:left"></div>

	<a class="glow">
		<div id=optionsTitle>
			<h1>Game Options</h1>
		</div>
	</a>
	<form style=display:none id=fSettings>
		<div class="section-title">Filesystem Settings</div>
		<div class="option-group">
			<div id=idbHider style=display:none>
				<label><input name=a type=radio id=rIndexedDB checked=true />IndexedDB (Need exit correctly to save changes)</label>
			</div>
			<label><input name=a type=radio id=rLocalStorage />LocalStorage (Sometimes not enough space)</label>
			<label><input name=a type=radio id=rNone />None(in RAM)</label>
		</div>

		<hr>

		<div class="section-title">Game Data Source</div>
		<div class="option-group">
			<div id=pkgHider style=display:none>
				<label><input name=b type=radio id=rPackage />Emscripten package from server (cached in IndexedDB if available)</label>
				<select id=selectPkg style=display:none></select>
			</div>
			<div id=zipHider style=display:none>
				<label><input name=b type=radio id=rZip checked=true />ZIP archive from server (slow, but small, no IndexedDB cache)</label>
				<select id=selectZip style=display:none></select>
			</div>
			<label><input name=b type=radio id=rLocalZip />Local ZIP file:</label>
			<label id="label_file_select"><input type=file name=c id=iZipFile />Select ZIP file</label>
		</div>

		<hr>

		<div class="section-title">Command Line Arguments</div>
		<input name=d type=text id=iArgs value="-dev 1 -game valve" />

		<input type=button onclick="startXash();return false;" value="Launch Xash3D!" />

		<br>
		<hr>

		<div id='linksPlaceholder' style=display:none>Download archives to load locally next time:</div><br>
	</form>

	<script type='text/javascript' src='browserfs.min.js'></script>
	<script type='text/javascript'>
		var zipMods = [];
		var pkgMods = [];
	</script>

	<script type='text/javascript' src='mods.js'></script>

	<script type='text/javascript'>
		var show_again = true;
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		var asyncDialog = document.getElementById('asyncDialog');
		var myerrorbuf = ''
		var myerrordate = new Date();
		var mounted = false;
		var gamedir = 'valve';
		var moduleCount = 0;
		//var mem = 150;
		var mfs;
		var zipSize;


		// make BrowserFS to work on ES5 browsers
		if (!ArrayBuffer['isView']) {
			ArrayBuffer.isView = function(a) {
				return a !== null && typeof(a) === "object" && a['buffer'] instanceof ArrayBuffer;
			};

		}

		showElement('optionsTitle', false);

		function prepareSelects() {
			var len = zipMods.length;
			var select = document.getElementById('selectZip');
			if (len) {
				showElement('zipHider', true);

				if (len > 1) {
					var links = '';
					for (var i = 0; i < len; i++) {
						select.options[i] = new Option(zipMods[i][1], zipMods[i][0]);
						links += '<br><a class="glow" onclick=location.href="' + zipMods[i][0] + '">' + zipMods[i][1] + '</a>';
					}
					select.style.display = 'block';
					document.getElementById('linksPlaceholder').innerHTML += links;
					//showElement('linksPlaceholder', true);
				}
			} else
				document.getElementById('rZip').checked = false;
			len = pkgMods.length;
			select = document.getElementById('selectPkg');
			if (len) {
				showElement('pkgHider', true);

				if (len > 1) {
					for (var i = 0; i < len; i++)
						select.options[i] = new Option(pkgMods[i][1], pkgMods[i][0]);
					//select.style.display = 'block';
				}
			} else
				document.getElementById('rPackage').checked = false;

			if (!zipMods.length && !len) {
				document.getElementById('rLocalZip').checked = true;
				showElement('rLocalZip', false);
			}
		}

		try {
			mem = Math.round(window.location.hash.substring(1));
		} catch (e) {};

		var Module = {
			TOTAL_MEMORY: mem * 1024 * 1024,
			preRun: [],
			postRun: [],
			print: (function() {
				var element = document.getElementById('output');
				if (element) element.value = ''; // clear browser cache
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					// These replacements are necessary if you render to raw HTML
					//text = text.replace(/&/g, "&amp;");
					//text = text.replace(/</g, "&lt;");
					//text = text.replace(/>/g, "&gt;");
					//text = text.replace('\n', '<br>', 'g');
					console.log(text);
					if (text) {
						myerrorbuf += text + '\n';
						if (text == "exit(0)")
						{
							document.getElementById('canvas').style.display = "none";
							setTimeout(function(){
								location.reload();
							}, 1000);
						}
						else if (text == "shader success") {
							// Show the canvas when shader is ready
							document.getElementById('canvas').style.display = "block";
							document.getElementById('status').innerHTML = "Game Ready!";
							// Hide the loader
							document.getElementById('loader1').style.display = "none";
						} else if (text.includes("Xash3D")) {
							// Update status for Xash3D messages
							document.getElementById('status').innerHTML = text;
						}
					}
					if (element) {
						if (element.value.length > 65536)
							element.value = element.value.substring(512) + myerrorbuf;
						else
							element.value += myerrorbuf;
						element.scrollTop = element.scrollHeight; // focus on bottom
					}
					myerrorbuf = ''
				};
			})(),
			printErr: function(text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				if (0) { // XXX disabled for safety typeof dump == 'function') {
					dump(text + '\n'); // fast, straight to the real console
				} else {
					if (myerrorbuf.length > 2048)
						myerrorbuf = 'some lines skipped\n' + myerrorbuf.substring(512);
					myerrorbuf += text + '\n';
					if (new Date() - myerrordate > 3000) {
						myerrordate = new Date();
						Module.print();
					}
				}
			},
			canvas: (function() {
				var canvas = document.getElementById('canvas');

				// As a default initial behavior, pop up an alert when webgl context is lost. To make your
				// application robust, you may want to override this behavior before shipping!
				// See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
				canvas.addEventListener("webglcontextlost", function(e) {
					alert('WebGL context lost. You will need to reload the page.');
					e.preventDefault();
				}, false);

				// Add pointer lock request when canvas becomes visible
				canvas.addEventListener('display', function() {
					if (document.getElementById('pointerLock').checked) {
						setTimeout(function() {
							canvas.requestPointerLock();
						}, 500);
					}
				});

				return canvas;
			})(),
			setStatus: function(text) {
				if (!Module.setStatus.last) Module.setStatus.last = {
					time: Date.now(),
					text: ''
				};
				if (text === Module.setStatus.text) return;
				if (new Date() - myerrordate > 3000) {
					myerrordate = new Date();
					Module.print();
				}

				statusElement.innerHTML = text;
				if (progressElement) {
					var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);

					if (m) {
						var progress = Math.round(parseInt(m[2]) * 100 / parseInt(m[4]));
						progressElement.style.color = progress > 5 ? '#303030' : '#aaa000';
						progressElement.style.width = progressElement.innerHTML = '' + progress + '%';
					}
					showElement('progress1', !!m);
				}
			},
			totalDependencies: 0,
			monitorRunDependencies: function(left) {
				this.totalDependencies = Math.max(this.totalDependencies, left);
				if (left)
					Module.setStatus('Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
			}
		};
		window.onerror = function(event) {
			if (mounted)
				FS.syncfs(false, function(err) {
					Module.print('Saving IDBFS: ' + err);
				});
			if (('' + event).indexOf('SimulateInfiniteLoop') > 0)
				return;
			var text = 'Exception thrown: ' + event;
			text = text.replace(/&/g, "&amp;");
			text = text.replace(/</g, "&lt;");
			text = text.replace(/>/g, "&gt;");
			text = text.replace('\n', '<br>', 'g');
			Module.setStatus(text);
			Module.print('Exception thrown: ' + event);
		};

		function haltRun() {}

		var savedRun;

		function radioChecked(id) {
			var r = document.getElementById('r' + id);
			if (r) return r.checked;

		function showElement(id, show) {
			var e = document.getElementById(id);

		function startXash() {
			showElement('loader1', false);
			showElement('optionsTitle', false);
			showElement('fSettings', false);
			setupFS();
			Module.arguments = document.getElementById('iArgs').value.split(' ');
			Module.run = run = savedRun;
			if (radioChecked('Zip')) {
				const zipper = document.getElementById('selectZip');
				if (zipMods.length > 1) {
					var mod_parts = [zipMods[0][3], zipMods[0][4], zipMods[0][2]];
					for (var i = 0; i < zipMods.length; i++) {
						if (zipMods[i][0] == zipper.value) {
							mod_parts = [zipMods[i][3], zipMods[i][4], zipMods[i][2]];
							break;
						}
					}
					fetchZIP(zipper.value, savedRun, mod_parts[0], mod_parts[1], mod_parts[2]);
				} else {
					fetchZIP(zipMods[0][0], savedRun, zipMods[0][3]);
				}
			} else if ((!zipMods.length && !pkgMods.length) || radioChecked('LocalZip')) {
				var reader = new FileReader();
				reader.onload = function() {
					mountZIP(reader.result);
					Module.print("Loaded zip data");
					savedRun();
				};
				reader.readAsArrayBuffer(document.getElementById('iZipFile').files[0]);
			} else if (radioChecked('Package')) {
				var script = document.createElement('script');
				script.onload = savedRun;
				document.body.appendChild(script);
				script.src = pkgMods.length > 1 ? document.getElementById('selectPkg').value : pkgMods[0][0];
			}
			//showElement('canvas', true);

			window.addEventListener("beforeunload", function(e) {
				var confirmationMessage = 'Leave the game?';

				(e || window.event).returnValue = confirmationMessage; //Gecko + IE
				return confirmationMessage; //Gecko + Webkit, Safari, Chrome etc.
			});
		}

		function mountZIP(data) {
			var Buffer = BrowserFS.BFSRequire('buffer').Buffer;
			mfs.mount('/zip', new BrowserFS.FileSystem.ZipFS(Buffer.from(data)));
			FS.mount(new BrowserFS.EmscriptenFS(), {
				root: '/zip'
			}, '/rodir');
		}

		function fetchZIP(packageName, cb, parts = 0, size_of_parts = 0, total_size = 0) {
			if (parts == 0) {
				var xhr = new XMLHttpRequest();
				xhr.open('GET', packageName, true);
				xhr.responseType = 'arraybuffer';

				xhr.onprogress = function(event) {
					var url = packageName;
					var size;
					if (event.total) size = event.total;
					else size = zipMods[document.getElementById('selectZip').selectedIndex][2];
					if (event.loaded) {
						var total = size;
						var loaded = event.loaded;
						var num = 0;
						if (Module['setStatus']) Module['setStatus']('Downloading data... (' + loaded + '/' + total + ')');
					} else if (!Module.dataFileDownloads) {
						if (Module['setStatus']) Module['setStatus']('Downloading data...');
					}
				};
				xhr.onerror = function(event) {
					throw new Error("NetworkError");
				}
				xhr.onload = function(event) {
					if (xhr.status == 200 || xhr.status == 304 || xhr.status == 206 || (xhr.status == 0 && xhr.response)) { // file URLs can return 0
						mountZIP(xhr.response);
						cb();
					} else {
						throw new Error(xhr.statusText + " : " + xhr.responseURL);
					}
				};
				xhr.send(null);
			} else {
				var buffers = new Uint8Array(total_size);
				var finished = 0;
				for (var i = 0; i < parts; i++) {
					const cur = i;
					const no_ext = packageName.slice(0, -4);
					const url1 = no_ext + '_out/' + no_ext + '-' + cur + '.zip';
					console.log(url1);
					const xhr = new XMLHttpRequest();
					xhr.open('GET', url1, true);
					xhr.responseType = 'arraybuffer';

					xhr.onprogress = function(event) {
						if (event.loaded) {
							var loaded = event.loaded;
							if (Module['setStatus']) Module['setStatus']('Downloading data... (' + ((finished * size_of_parts) + loaded) + '/' + total_size + ')');
						} else if (!Module.dataFileDownloads) {
							if (Module['setStatus']) Module['setStatus']('Downloading data...');
						}
					};
					xhr.onerror = function(event) {
						throw new Error("NetworkError");
					}
					xhr.onload = function(event) {
						if (xhr.status == 200 || xhr.status == 304 || xhr.status == 206 || (xhr.status == 0 && xhr.response)) { // file URLs can return 0
							finished++;
							buffers.set(new Uint8Array(xhr.response), cur * size_of_parts);
							if (finished == parts) {
								mountZIP(buffers);
								cb();
							}
						} else {
							throw new Error(xhr.statusText + " : " + xhr.responseURL);
						}
					};
					xhr.send(null);
				}
			}
		}

		function setupFS() {
			FS.mkdir('/rodir');
			FS.mkdir('/xash');
			try {
				mfs = new BrowserFS.FileSystem.MountableFileSystem();
				BrowserFS.initialize(mfs);
			} catch (e) {
				mfs = undefined;
				Module.print('Failed to initialize BrowserFS: ' + e);
			}

			if (radioChecked('IndexedDB')) {
				FS.mount(IDBFS, {}, '/xash');
				FS.syncfs(true, function(err) {
					if (err) Module.print('Loading IDBFS: ' + err);
				});
				mounted = true;
			}

			if (radioChecked('LocalStorage') && mfs) {
				mfs.mount('/ls', new BrowserFS.FileSystem.LocalStorage());
				FS.mount(new BrowserFS.EmscriptenFS(), {
					root: '/ls'
				}, '/xash');
				Module.print('LocalStorage mounted');
			}

			FS.chdir('/xash/');
		}

			ENV.XASH3D_GAMEDIR = gamedir;

			function loadModule(name) {
				var script = document.createElement('script');
				script.onload = function() {
					moduleCount++;
					Module.setStatus("Script " + name + " loaded (" + moduleCount + "/3)");
					if (moduleCount == 3) {
						Module.setStatus("All scripts downloaded! Ready to launch.");
					}
				};
				script.onerror = function() {
					Module.setStatus("Failed to load " + name + ".js");
				};
				document.body.appendChild(script);
				script.src = name + ".js";
			}

			loadModule("server");
			loadModule("client");
			loadModule("menu");
		};

		Module.websocket.url = 'wsproxy://4.tcp.ngrok.io:10657/';
		ENV = [];

		// Add pointer lock event listeners
		document.addEventListener('pointerlockchange', function() {
			if (document.pointerLockElement === document.getElementById('canvas')) {
				// Pointer is locked
				console.log('Pointer locked');
			} else {
				// Pointer is unlocked - try to re-lock if the game is running
				console.log('Pointer unlocked');
				if (document.getElementById('canvas').style.display !== 'none') {
					// Game is running, try to re-capture mouse
					setTimeout(function() {
						if (document.getElementById('pointerLock').checked) {
							document.getElementById('canvas').requestPointerLock();
						}
					}, 100);
				}
			}
		});

		document.addEventListener('pointerlockerror', function() {
			console.log('Pointer lock error');
		});

		// Add click handler to canvas for re-capturing mouse
		document.getElementById('canvas').addEventListener('click', function() {
			if (document.getElementById('pointerLock').checked && 
				document.pointerLockElement !== document.getElementById('canvas')) {
				this.requestPointerLock();
			}
		});

		// Fullscreen change event listeners
		document.addEventListener('fullscreenchange', handleFullscreenChange);
		document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
		document.addEventListener('mozfullscreenchange', handleFullscreenChange);
		document.addEventListener('MSFullscreenChange', handleFullscreenChange);

		function handleFullscreenChange() {
			var canvas = document.getElementById('canvas');
			var container = document.querySelector('.emscripten_border');
			
			if (document.fullscreenElement || document.webkitFullscreenElement || 
				document.mozFullScreenElement || document.msFullscreenElement) {
				// Entered fullscreen
				if (document.getElementById('resize').checked) {
					canvas.style.width = '100vw';
					canvas.style.height = '100vh';
				}
				if (document.getElementById('pointerLock').checked) {
					setTimeout(function() {
						canvas.requestPointerLock();
					}, 100);
				}
			} else {
				// Exited fullscreen
				canvas.style.width = '';
				canvas.style.height = '';
			}
		}

		// Function to manually re-capture mouse
		function recaptureMouse() {
			if (document.getElementById('pointerLock').checked && 
				document.getElementById('canvas').style.display !== 'none') {
				document.getElementById('canvas').requestPointerLock();
			}
		}

		// Enhanced fullscreen function
		Module.requestFullscreen = function(pointerLock, resize) {
			var canvas = document.getElementById('canvas');
			var container = document.querySelector('.emscripten_border');
			
			if (!document.fullscreenElement) {
				// Enter fullscreen
				if (container.requestFullscreen) {
					container.requestFullscreen();
				} else if (container.webkitRequestFullscreen) {
					container.webkitRequestFullscreen();
				} else if (container.msRequestFullscreen) {
					container.msRequestFullscreen();
				}
				
				// Adjust canvas size for fullscreen
				setTimeout(function() {
					if (resize) {
						canvas.style.width = '100vw';
						canvas.style.height = '100vh';
					}
					if (pointerLock) {
						canvas.requestPointerLock();
					}
				}, 100);
			} else {
				// Exit fullscreen
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				} else if (document.msExitFullscreen) {
					document.msExitFullscreen();
				}
				
				// Reset canvas size
				setTimeout(function() {
					canvas.style.width = '';
					canvas.style.height = '';
				}, 100);
			}
		};
	</script>
