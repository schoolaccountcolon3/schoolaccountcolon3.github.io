<!doctype html>
<html lang="en-us">
  <head>
    <script src="enable-threads.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tetris - Game Hub</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: var(--font-main);
        margin: 0;
        padding: 0;
        background-color: var(--color-bg);
        color: var(--color-fg);
        overflow-x: hidden;
      }

      .game-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: var(--color-card-bg);
        padding: 15px 20px;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 10px var(--color-shadow);
      }

      .game-title {
        font-size: 1.3em;
        font-weight: 600;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .game-controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .control-button {
        padding: 8px 16px;
        background: var(--color-button-bg);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .control-button:hover {
        background: var(--color-button-hover);
        transform: translateY(-1px);
      }

      .emscripten {
        padding-right: 0;
        margin-left: auto;
        margin-right: auto;
        display: block;
        margin-top: 70px;
      }

      div.emscripten {
        text-align: center;
      }

      div.emscripten_border {
        text-align: center;
        margin-top: 70px;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        box-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
        max-width: 100vw;
        max-height: 100vh;
      }

      /* Fullscreen canvas adjustments */
      canvas.emscripten:fullscreen {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none;
        max-height: none;
      }

      /* Fullscreen container adjustments */
      .emscripten_border:fullscreen {
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      #status {
        position: fixed;
        top: 70px;
        left: 20px;
        z-index: 999;
        background: var(--color-card-bg);
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        box-shadow: 0 2px 8px var(--color-shadow);
        color: var(--color-fg);
        font-weight: 500;
      }

      #progress {
        position: fixed;
        top: 110px;
        left: 20px;
        z-index: 999;
        width: 200px;
        height: 20px;
        background: var(--color-bg);
        border: 2px solid var(--color-primary);
        border-radius: 6px;
        overflow: hidden;
        display: none;
      }

      #progress::-webkit-progress-bar {
        background: var(--color-bg);
        border-radius: 4px;
      }

      #progress::-webkit-progress-value {
        background: var(--color-primary);
        border-radius: 4px;
      }

      #progress::-moz-progress-bar {
        background: var(--color-primary);
        border-radius: 4px;
      }

      #controls {
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 999;
        background: var(--color-card-bg);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid var(--color-border);
        box-shadow: 0 4px 12px var(--color-shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 200px;
      }

      #controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-fg);
        font-size: 0.9em;
        cursor: pointer;
        transition: color 0.3s ease;
      }

      #controls label:hover {
        color: var(--color-primary);
      }

      #controls input[type="checkbox"] {
        margin: 0;
      }

      #controls input[type="button"] {
        padding: 8px 12px;
        background: var(--color-button-bg);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.3s ease;
        width: 100%;
      }

      #controls input[type="button"]:hover {
        background: var(--color-button-hover);
        transform: translateY(-1px);
      }

      .spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        border: 4px solid var(--color-border);
        border-radius: 50%;
        border-top: 4px solid var(--color-primary);
        width: 40px;
        height: 40px;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .game-header {
          padding: 10px 15px;
        }

        .game-title {
          font-size: 1.1em;
        }

        .control-button {
          padding: 6px 12px;
          font-size: 0.8em;
        }

        #controls {
          top: 60px;
          right: 10px;
          min-width: 180px;
        }

        #status {
          top: 60px;
          left: 10px;
          font-size: 0.9em;
        }

        #progress {
          top: 100px;
          left: 10px;
          width: 150px;
        }
      }
    </style>
  </head>
  <body>

    <div class="game-header">
      <div class="game-title">
        <i class="fas fa-th"></i>
        Tetris
      </div>
      <div class="game-controls">
        <button class="control-button" onclick="location.href='../index.html'">
          <i class="fas fa-arrow-left"></i>
          Back
        </button>
        <button class="control-button" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
          <i class="fas fa-expand"></i>
          Fullscreen
        </button>
      </div>
    </div>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <div id="controls">
      <label>
        <input type="checkbox" id="resize">
        <i class="fas fa-expand-arrows-alt"></i>
        Resize Canvas
      </label>
      <label>
        <input type="checkbox" id="pointerLock" checked>
        <i class="fas fa-mouse-pointer"></i>
        Lock Mouse Pointer
      </label>
      <input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
    </div>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      // Enhanced fullscreen function
      Module.requestFullscreen = function(pointerLock, resize) {
        var canvas = document.getElementById('canvas');
        var container = document.querySelector('.emscripten_border');
        
        if (!document.fullscreenElement) {
          // Enter fullscreen
          if (container.requestFullscreen) {
            container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
          } else if (container.msRequestFullscreen) {
            container.msRequestFullscreen();
          }
          
          // Adjust canvas size for fullscreen
          setTimeout(function() {
            if (resize) {
              canvas.style.width = '100vw';
              canvas.style.height = '100vh';
            }
            if (pointerLock) {
              canvas.requestPointerLock();
            }
          }, 100);
        } else {
          // Exit fullscreen
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
          
          // Reset canvas size
          setTimeout(function() {
            canvas.style.width = '';
            canvas.style.height = '';
          }, 100);
        }
      };

      // Fullscreen change event listeners
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
      document.addEventListener('mozfullscreenchange', handleFullscreenChange);
      document.addEventListener('MSFullscreenChange', handleFullscreenChange);

      function handleFullscreenChange() {
        var canvas = document.getElementById('canvas');
        
        if (document.fullscreenElement || document.webkitFullscreenElement || 
            document.mozFullScreenElement || document.msFullscreenElement) {
          // Entered fullscreen
          if (document.getElementById('resize').checked) {
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
          }
          if (document.getElementById('pointerLock').checked) {
            setTimeout(function() {
              canvas.requestPointerLock();
            }, 100);
          }
        } else {
          // Exited fullscreen
          canvas.style.width = '';
          canvas.style.height = '';
        }
      }

      var Module = {
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          // if this is a progress update, skip it if too soon
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = (event) => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    <script async type="text/javascript" src="Apotris.js"></script>
  </body>
</html>
