<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>def google classroom</title>
      <link rel="icon" type="image/png" href="./favicon.png" />
      <link rel="stylesheet" href="./styles/style.css" />
      <script src="./theme.js"></script>
      <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
      <!-- Font Awesome for icons -->
      <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v7.1.0/css/all.css"/>
      <style>
         /* Modal styles */
         .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
         }

         .modal-overlay.open {
            display: flex;
         }

         .modal-window {
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px var(--color-shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease-out;
         }

         @keyframes modalFadeIn {
            from {
               opacity: 0;
               transform: scale(0.9);
            }
            to {
               opacity: 1;
               transform: scale(1);
            }
         }

         .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
         }

         .modal-header h2 {
            margin: 0;
            color: var(--color-fg);
            font-size: 1.5em;
         }

         .modal-close {
            background: none;
            border: none;
            color: var(--color-fg);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
         }

         .modal-close:hover {
            background-color: var(--color-button-hover);
         }

         .modal-content {
            padding: 20px;
         }

         .modal-game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--color-bg);
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
         }

         .modal-game-item:hover {
            background: var(--color-button-hover);
            transform: translateX(5px);
            border-color: var(--color-primary);
         }

         .modal-game-item i {
            font-size: 1.2em;
            color: var(--color-primary);
            width: 20px;
            text-align: center;
         }

         .modal-game-item a {
            flex: 1;
            color: var(--color-link);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
         }

         .modal-game-item a:hover {
            color: var(--color-link-hover);
         }
      </style>
   </head>
   <body>
            <!-- Popup Notification -->
               <div id="word-popup" style="display:none;position:fixed;right:32px;bottom:-300px;z-index:9999;transition:bottom 0.5s cubic-bezier(.4,2,.6,1);padding:0;margin:0;background:none;box-shadow:none;border-radius:18px 18px 0 0;">
                  <img id="word-popup-img" src="" alt="Popup" style="max-width:220px;max-height:180px;cursor:pointer;display:block;" />
               </div>
      <div id="particles-js"></div>
      <!-- Theme Switcher -->
      <div id="styleSwitcher"></div>

      <!-- Game Search Bar (moved to side)
      <div id="game-search-bar" class="side-search-bar">
         <input type="text" id="game-search-input" placeholder="Search games..." autocomplete="off" />
         <i class="fas fa-search"></i>
      </div>  -->

      <!-- Modal Overlay -->
      <div id="modal-overlay" class="modal-overlay">
         <div class="modal-window">
            <div class="modal-header">
               <h2 id="modal-title"></h2>
               <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-content" id="modal-content"></div>
         </div>
      </div>

      <!-- Main Content -->
      <div class="container">
         <h1 class="main-title">
            <i class="fas fa-gamepad"></i>
            def google classroom
         </h1>

         <!-- Games will be loaded here from JSON -->
         <div id="games-container"></div>

         <!-- Action Buttons -->
         <div class="action-buttons">
            <button class="button-16" onclick="openInBlank()">
               <i class="fas fa-external-link-alt"></i>
               Open in about:blank
            </button>
         </div>
      </div>

      <!-- JavaScript -->
      <script>
               // Popup trigger words and images
                     const popupWords = {
                        'test': {
                           img: '/img/test.png'
                        }
                        // Add more words here: 'word': { img: '...' }
                     };

               // Listen for typing anywhere on the main page
               let popupBuffer = '';
               document.addEventListener('keydown', function(e) {
                  // Ignore if typing in an input/textarea
                  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.isContentEditable)) return;
                  // Only allow a-z, 0-9, space, backspace
                  if (e.key.length === 1 && /[a-zA-Z0-9 ]/.test(e.key)) {
                     popupBuffer += e.key.toLowerCase();
                     if (popupBuffer.length > 20) popupBuffer = popupBuffer.slice(-20);
                  } else if (e.key === 'Backspace') {
                     popupBuffer = popupBuffer.slice(0, -1);
                  } else {
                     return;
                  }
                  // Check for any trigger word at the end
                  for (const word in popupWords) {
                     if (popupBuffer.endsWith(word)) {
                        showWordPopup(word);
                        popupBuffer = '';
                        break;
                     }
                  }
               });

                     function showWordPopup(word) {
                        const popup = document.getElementById('word-popup');
                        const img = document.getElementById('word-popup-img');
                        img.src = popupWords[word].img;
                        popup.style.display = '';
                        setTimeout(() => {
                           popup.style.bottom = '0px';
                        }, 10);
                     }

               // Hide popup on image click
                     document.addEventListener('DOMContentLoaded', function() {
                        const popup = document.getElementById('word-popup');
                        const img = document.getElementById('word-popup-img');
                        img.addEventListener('click', function() {
                           popup.style.bottom = '-300px';
                           setTimeout(() => { popup.style.display = 'none'; }, 500);
                        });
                     });
         // Initialize particles.js with enhanced configuration
         particlesJS('particles-js', {
           particles: {
             number: {
               value: 100,
               density: {
                 enable: true,
                 value_area: 800
               }
             },
             color: {
               value: '#ffffff'
             },
             shape: {
               type: 'circle'
             },
             opacity: {
               value: 0.15,
               random: true,
               anim: {
                 enable: true,
                 speed: 1.5,
                 opacity_min: 0.05,
                 sync: false
               }
             },
             size: {
               value: 3,
               random: true
             },
             line_linked: {
               enable: true,
               distance: 150,
               color: '#ffffff',
               opacity: 0.15,
               width: 1
             },
             move: {
               enable: true,
               speed: 1.2,
               direction: 'none',
               random: true,
               straight: false,
               out_mode: 'out',
               bounce: false
             }
           },
           interactivity: {
             detect_on: 'canvas',
             events: {
               onhover: {
                 enable: true,
                 mode: 'grab'
               },
               onclick: {
                 enable: true,
                 mode: 'push'
               },
               resize: true
             },
             modes: {
               grab: {
                 distance: 140,
                 line_linked: {
                   opacity: 0.3
                 }
               },
               push: {
                 particles_nb: 4
               }
             }
           },
           retina_detect: true
         });

         function openInBlank() {
           const win = window.open();
           const iframe = win.document.createElement('iframe');
           Object.assign(iframe.style, {
             border: 'none',
             width: '100%',
             height: '100%',
             margin: '0'
           });
           iframe.referrerPolicy = 'no-referrer';
           iframe.allow = 'fullscreen';
           iframe.src = document.URL;
         
           win.document.body.style.margin = '0';
           win.document.body.style.height = '100vh';
           win.document.body.appendChild(iframe);
         }


         // Game Search Functionality with auto-open dropdowns
         const searchInput = document.getElementById('game-search-input');
         if (searchInput) {
           searchInput.addEventListener('input', function () {
             const query = this.value.trim().toLowerCase();

             document.querySelectorAll('.dropdown, .games-section').forEach(section => {
               let anyVisible = false;
               section.querySelectorAll('.game-item').forEach(item => {
                 const text = item.textContent.toLowerCase();
                 if (query === "" || text.includes(query)) {
                   item.style.display = "";
                   anyVisible = true;
                 } else {
                   item.style.display = "none";
                 }
               });
               // Hide entire dropdown if no items match (for dropdowns)
               const dropdownContent = section.querySelector('.dropdown-content');
               if (dropdownContent) {
                 dropdownContent.style.display = anyVisible ? "" : "none";
                 // Auto-open dropdowns if searching
                 const dropdown = section;
                 if (typeof dropdown.openDropdown === "function") {
                   if (query && anyVisible) {
                     dropdown.openDropdown();
                   } else if (!query) {
                     dropdown.closeDropdown();
                   }
                 }
               }
             });
           });
         }

         // Load games from JSON
         async function loadGames() {
           try {
             const response = await fetch('./games.json');
             if (!response.ok) throw new Error('Failed to load games');
             const data = await response.json();
             renderGames(data.sections);
           } catch (error) {
             console.error('Error loading games:', error);
             document.getElementById('games-container').innerHTML = '<p>Error loading games. Please refresh the page.</p>';
           }
         }

         function renderGames(sections) {
           const container = document.getElementById('games-container');
           container.innerHTML = '';

           sections.forEach(section => {
             if (section.type === 'dropdown') {
               const dropdown = document.createElement('div');
               dropdown.className = 'dropdown';
               dropdown.setAttribute('data-section-id', section.id);

               const header = document.createElement('div');
               header.className = 'dropdown-header';
               header.innerHTML = `<i class="${section.icon}"></i> ${section.name} <span class="arrow">&#9660;</span>`;

               const content = document.createElement('div');
               content.className = 'dropdown-content';

               section.games.forEach((game, index) => {
                 const gameItem = document.createElement('div');
                 gameItem.className = 'game-item' + (game.featured ? ' featured' : '');
                 
                 const link = document.createElement('a');
                 link.href = game.url;
                 link.innerHTML = `<i class="${game.icon}"></i> ${game.name}`;
                 
                 if (game.special === 'combinedLink') {
                   link.id = 'combinedLink';
                   link.addEventListener('click', function(e) {
                     e.preventDefault();
                     // Add your flash emulator logic here if needed
                   });
                 }

                 gameItem.appendChild(link);
                 content.appendChild(gameItem);

                 // Add separator after featured item if it's not the last
                 if (game.featured && index < section.games.length - 1) {
                   const hr = document.createElement('hr');
                   hr.className = 'rounded';
                   content.appendChild(hr);
                 }
               });

               dropdown.appendChild(header);
               dropdown.appendChild(content);
               container.appendChild(dropdown);
             } else if (section.type === 'grid') {
               const gamesSection = document.createElement('div');
               gamesSection.className = 'games-section';

               const title = document.createElement('h2');
               title.className = 'section-title';
               title.innerHTML = `<i class="${section.icon}"></i> ${section.name}`;

               const grid = document.createElement('div');
               grid.className = 'games-grid';

               section.games.forEach(game => {
                const gameItem = document.createElement('div');
                gameItem.className = 'game-item' + (game.featured ? ' featured' : '');
                 
                 const link = document.createElement('a');
                 link.href = game.url;
                 link.innerHTML = `<i class="${game.icon}"></i> ${game.name}`;
                 
                 // Check if this game should open a modal
                 if (game.modal) {
                   link.addEventListener('click', function(e) {
                     e.preventDefault();
                     openModalFromGame(game.modal);
                   });
                 }
                 
                 gameItem.appendChild(link);
                 grid.appendChild(gameItem);
               });

               gamesSection.appendChild(title);
               gamesSection.appendChild(grid);
               container.appendChild(gamesSection);
             }
           });

           // Initialize dropdown functionality after rendering
           initializeDropdowns();
         }

         function initializeDropdowns() {
           document.querySelectorAll('.dropdown').forEach(dropdown => {
             const header = dropdown.querySelector('.dropdown-header');
             const content = dropdown.querySelector('.dropdown-content');
             let isOpen = false;

             header.addEventListener('click', () => {
               isOpen = !isOpen;

               if (isOpen) {
                 content.style.maxHeight = content.scrollHeight + 'px';
                 dropdown.classList.add('open');
               } else {
                 content.style.maxHeight = content.scrollHeight + 'px';
                 requestAnimationFrame(() => {
                   content.style.maxHeight = '0';
                   dropdown.classList.remove('open');
                 });
               }
             });

             // Expose methods for programmatic control
             dropdown.openDropdown = function() {
               isOpen = true;
               content.style.maxHeight = content.scrollHeight + 'px';
               dropdown.classList.add('open');
             };
             dropdown.closeDropdown = function() {
               isOpen = false;
               content.style.maxHeight = '0';
               dropdown.classList.remove('open');
             };
           });
         }

         // Modal functions
         function openModal(section) {
           const overlay = document.getElementById('modal-overlay');
           const title = document.getElementById('modal-title');
           const content = document.getElementById('modal-content');
           
           title.innerHTML = `<i class="${section.icon}"></i> ${section.name}`;
           content.innerHTML = '';
           
           section.games.forEach(game => {
             const gameItem = document.createElement('div');
             gameItem.className = 'modal-game-item';
             
             const link = document.createElement('a');
             link.href = game.url;
             link.target = '_blank';
             link.innerHTML = `<i class="${game.icon}"></i> ${game.name}`;
             
             gameItem.appendChild(link);
             content.appendChild(gameItem);
           });
           
           overlay.classList.add('open');
           document.body.style.overflow = 'hidden';
         }

         function openModalFromGame(modalData) {
           const overlay = document.getElementById('modal-overlay');
           const title = document.getElementById('modal-title');
           const content = document.getElementById('modal-content');
           
           title.innerHTML = modalData.title;
           content.innerHTML = '';
           
           modalData.games.forEach(game => {
             const gameItem = document.createElement('div');
             gameItem.className = 'modal-game-item';
             
             const link = document.createElement('a');
             link.href = game.url;
             link.target = '_blank';
             link.innerHTML = `<i class="${game.icon}"></i> ${game.name}`;
             
             gameItem.appendChild(link);
             content.appendChild(gameItem);
           });
           
           overlay.classList.add('open');
           document.body.style.overflow = 'hidden';
         }

         function closeModal() {
           const overlay = document.getElementById('modal-overlay');
           overlay.classList.remove('open');
           document.body.style.overflow = '';
         }

         // Close modal on close button click
         document.getElementById('modal-close').addEventListener('click', closeModal);

         // Close modal on overlay click (outside modal)
         document.getElementById('modal-overlay').addEventListener('click', function(e) {
           if (e.target === this) {
             closeModal();
           }
         });

         // Close modal on Escape key
         document.addEventListener('keydown', function(e) {
           if (e.key === 'Escape') {
             const overlay = document.getElementById('modal-overlay');
             if (overlay.classList.contains('open')) {
               closeModal();
             }
           }
         });

         // Load games on page load
         document.addEventListener('DOMContentLoaded', loadGames);
      </script>
   </body>
</html>
