<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/schoolaccountcolon3/schoolaccountcolon3.github.io/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Google Classroom</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPP231DLCZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CPP231DLCZ');
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Loading...</div>
    </div>

    <div id="styleSwitcher"></div>

    <nav id="sidebar">
        <div class="sidebar-header">Apps</div>
        <div class="nav-scroll" id="nav-container">
            <!-- Injected via JS -->
        </div>
    </nav>

    <main id="main">
        <div id="topbar">
            <div class="topbar-controls">
                <input type="text" id="search-input" placeholder="Search games...">
                <label class="cloak-label">
                    <input type="checkbox" id="cloak-toggle">
                    Open in about:blank
                </label>
            </div>
            <div id="tags-container">
                <!-- Tags injected via JS -->
            </div>
        </div>
        <div id="content-area">
            <!-- Injected via JS -->
        </div>
    </main>

    <!-- Update Notification & Modal -->
    <div id="update-notification" style="display: none;">
        <span id="update-text">Update: April 18th</span>
        <button id="close-update-btn" title="Dismiss">&times;</button>
    </div>

    <div id="update-modal">
        <div id="update-modal-content">
            <button id="update-modal-close" title="Close">&times;</button>
            <div id="update-modal-text">Loading...</div>
        </div>
    </div>

    <script>
        const PROVIDER_URLS = {
            "math": "https://cdn.jsdelivr.net/gh/lemonsky47/storage@storage/",
            "ugs": "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/"
        };

        const navContainer = document.getElementById('nav-container');
        const contentArea = document.getElementById('content-area');
        const searchInput = document.getElementById('search-input');
        const tagsContainer = document.getElementById('tags-container');
        const loader = document.getElementById('loader');
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('main');
        const cloakToggle = document.getElementById('cloak-toggle');
        
        let showHidden = false;
        let keyBuffer = '';
        const SECRET_CODE = 'secrethidden';
        let activeTag = null; 

        const urlParams = new URLSearchParams(window.location.search);
        const gameParam = urlParams.get('g');
        const providerParam = urlParams.get('p');

        // Lazy load canvases using IntersectionObserver
        const canvasObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const canvas = entry.target;
                    const gameName = canvas.getAttribute('data-name');
                    if (gameName && !canvas.rendered) {
                        renderCanvasText(canvas, gameName);
                        canvas.rendered = true;
                    }
                    observer.unobserve(canvas);
                }
            });
        }, { rootMargin: '150px' });

        // Conditional loading flow: Bypass downloading games.js if opening a game
        if (gameParam) {
            initializeGameMode(gameParam, providerParam, true);
        } else {
            // Home page: dynamically load games.js, then build the menu
            const script = document.createElement('script');
            script.src = 'games.js';
            script.onload = () => {
                initializeMenuMode();
            };
            script.onerror = () => {
                loader.style.display = 'none';
                contentArea.innerHTML = '<h2 style="padding:20px; color:#ef4444;">Error: games.js failed to load.</h2>';
            };
            document.body.appendChild(script);
        }

        document.addEventListener('keyup', (event) => {
            if (event.key.length !== 1) return;
            keyBuffer = (keyBuffer + event.key.toLowerCase()).slice(-SECRET_CODE.length);
            if (!showHidden && keyBuffer === SECRET_CODE) {
                showHidden = true;
                renderGames(searchInput.value);
            }
        });

        // Searches the list if available (fallback for direct URL hits without &p parameter)
        function findGameByFile(filename) {
            if (typeof GAME_DATA === 'undefined') return null;
            for (const category in GAME_DATA) {
                const found = GAME_DATA[category].find(g => g.file === filename);
                if (found) return found;
            }
            return null;
        }

        function getGameUrl(filename, provider) {
            // Keep local/relative assets and absolute external URLs unchanged
            if (filename.startsWith("http://") || filename.startsWith("https://") || filename.startsWith("./") || filename.startsWith("/")) {
                return filename;
            }

            // Fallback lookup if provider was not explicitly passed in URL
            if (!provider) {
                const game = findGameByFile(filename);
                if (game) {
                    provider = game.provider;
                }
            }

            // Match base URL or default to UGS if provider remains unmatched
            const baseUrl = PROVIDER_URLS[provider] || PROVIDER_URLS["ugs"];
            return `${baseUrl}${filename}?t=${Date.now()}`;
        }

        function cleanGameHtml(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            function transformGithackToJsdelivr(url) {
                if (url.includes('rawcdn.githack.com')) {
                    const match = url.match(/https:\/\/rawcdn\.githack\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)/);
                    if (match) {
                        const [, user, repo, branch, path] = match;
                        return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
                    }
                }
                return url;
            }

            const elements = doc.querySelectorAll('[src], [href]');
            elements.forEach(el => {
                if (el.src) el.src = transformGithackToJsdelivr(el.src);
                if (el.href) el.href = transformGithackToJsdelivr(el.href);
            });

            doc.querySelectorAll('[id^="sidebarad"], [class*="sidebarad"]')
               .forEach(el => el.remove());

            const sdkPatterns = ['gamemonetize', 'st39/sdk', 'ga.js', 'sdk.js'];
            doc.querySelectorAll('script[src]').forEach(el => {
                if (sdkPatterns.some(p => el.src.includes(p))) el.remove();
            });

            doc.querySelectorAll('script:not([src])').forEach(el => {
                const text = el.textContent || '';
                const obfuscatedMatches = (text.match(/_0x[0-9a-f]+/gi) || []).length;
                if (obfuscatedMatches > 10) el.remove();
            });

            let doctype = "";
            if (doc.doctype) {
                doctype = `<!DOCTYPE ${doc.doctype.name}>\n`;
            }
            return doctype + doc.documentElement.outerHTML;
        }

        function initializeGameMode(filename, provider, needsDecode) {
            sidebar.style.display = 'none';
            main.style.display = 'none';
            loader.style.display = 'flex';

            const realFilename = needsDecode ? decodeURIComponent(filename) : filename;
            const realProvider = needsDecode && provider ? decodeURIComponent(provider) : provider;
            const url = getGameUrl(realFilename, realProvider);

            document.getElementById('loader-text').textContent = "Launching...";

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(html => {
                    const cleanedHtml = cleanGameHtml(html);
                    document.open();
                    document.write(cleanedHtml);
                    document.close();
                })
                .catch(err => {
                    loader.innerHTML = `<div style="text-align:center; padding:20px;">
                        <h2>Error Loading Game</h2>
                        <p>Could not fetch game data.</p>
                        <button onclick="window.location.href = window.location.pathname" style="padding:10px; cursor:pointer; margin-top:10px;">Return to Menu</button>
                    </div>`;
                    console.error(err);
                });
        }
        
        function renderTagCanvas(canvas, text, isActive) {
            const font = '400 13px "Source Sans 3", Helvetica, Arial, sans-serif';
            const ctx = canvas.getContext('2d');
            ctx.font = font;
            
            const metrics = ctx.measureText(text);
            const width = Math.max(1, Math.ceil(metrics.width));
            const height = 16; 

            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = font;
            ctx.textBaseline = 'top';
            
            ctx.fillStyle = isActive ? '#121212' : '#aaa';
            ctx.fillText(text, 0, 1);
        }

        function initializeMenuMode() {
            loader.style.display = 'none';

            if (typeof GAME_DATA === 'undefined') {
                contentArea.innerHTML = '<h2 style="padding:20px; color:#ef4444;">Error: games.js not found. Run convert.py first!</h2>';
                return;
            }

            const allTagsSet = new Set();
            Object.values(GAME_DATA).forEach(games => {
                games.forEach(g => {
                    if (g.tags) {
                        g.tags.forEach(t => {
                            if (t.toLowerCase() !== 'hidden') {
                                allTagsSet.add(t);
                            }
                        });
                    }
                });
            });

            tagsContainer.innerHTML = '';
            Array.from(allTagsSet).sort().forEach(tag => {
                const tagBtn = document.createElement('button');
                tagBtn.className = 'tag-btn';
                
                const canvas = document.createElement('canvas');
                canvas.setAttribute('data-tag', tag);
                tagBtn.appendChild(canvas);
                
                renderTagCanvas(canvas, tag, false);
                
                tagBtn.onclick = () => {
                    if (activeTag === tag) {
                        activeTag = null;
                        tagBtn.classList.remove('active');
                        renderTagCanvas(canvas, tag, false);
                    } else {
                        document.querySelectorAll('.tag-btn').forEach(b => {
                            if (b.classList.contains('active')) {
                                b.classList.remove('active');
                                const c = b.querySelector('canvas');
                                if (c) renderTagCanvas(c, c.getAttribute('data-tag'), false);
                            }
                        });
                        
                        activeTag = tag;
                        tagBtn.classList.add('active');
                        renderTagCanvas(canvas, tag, true);
                    }
                    renderGames(searchInput.value);
                };
                tagsContainer.appendChild(tagBtn);
            });

            const keys = Object.keys(GAME_DATA);
            const standardCats = keys.filter(k => k.length === 1).sort();
            const specialCats = keys.filter(k => k.length > 1).sort();

            if (standardCats.length > 0) standardCats.forEach(cat => createNavBtn(cat));
            if (specialCats.length > 0) specialCats.forEach(cat => createNavBtn(cat));

            const runInitialRender = () => renderGames();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(runInitialRender);
            } else {
                runInitialRender();
            }

            searchInput.addEventListener('input', (e) => renderGames(e.target.value));
        }

        function scrollToCategory(category) {
            const el = document.getElementById(`cat-${category}`);
            if (el) {
                const topbar = document.getElementById('topbar');
                const topbarHeight = topbar ? topbar.getBoundingClientRect().height : 0;
                
                const targetY = el.getBoundingClientRect().top + window.scrollY - topbarHeight - 20;
                
                window.scrollTo({ top: targetY, behavior: 'smooth' });
                el.style.opacity = '0.5';
                setTimeout(() => el.style.opacity = '1', 300);
            }
        }

        function createNavBtn(category) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            
            btn.textContent = category.charAt(0).toUpperCase();
            btn.title = category;
            
            btn.onclick = () => {
                let needsRender = false;
                
                if (activeTag) {
                    activeTag = null;
                    document.querySelectorAll('.tag-btn').forEach(b => {
                        b.classList.remove('active');
                        const c = b.querySelector('canvas');
                        if (c) renderTagCanvas(c, c.getAttribute('data-tag'), false);
                    });
                    needsRender = true;
                }

                if (needsRender) {
                    renderGames(searchInput.value);
                    setTimeout(() => scrollToCategory(category), 50);
                } else {
                    scrollToCategory(category);
                }
            };
            navContainer.appendChild(btn);
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game);
            
            const canvas = document.createElement('canvas');
            canvas.setAttribute('data-name', game.name);
            
            card.appendChild(canvas);
            canvasObserver.observe(canvas);
            
            return card;
        }

        function renderGames(filterText = '') {
            contentArea.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();

            const allCategories = Object.keys(GAME_DATA).sort((a, b) => {
                const isASingle = a.length === 1;
                const isBSingle = b.length === 1;
                if (isASingle && !isBSingle) return -1;
                if (!isASingle && isBSingle) return 1;
                return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
            });

            // If a tag is active, consolidate all matching games into ONE category block
            if (activeTag) {
                let matchingGames = [];

                allCategories.forEach(category => {
                    const games = GAME_DATA[category].filter(g => {
                        const isSecretGame = g.hidden === "true" || (g.tags && g.tags.some(t => t.toLowerCase() === 'hidden'));
                        if (isSecretGame && !showHidden) return false;
                        if (!g.tags || !g.tags.includes(activeTag)) return false;
                        return g.name.toLowerCase().includes(lowerFilter);
                    });
                    matchingGames.push(...games);
                });

                if (matchingGames.length > 0) {
                    matchingGames.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                    const section = document.createElement('div');
                    section.className = 'category-section';

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = `Tag: ${activeTag}`;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'game-grid';

                    matchingGames.forEach(game => {
                        grid.appendChild(createGameCard(game));
                    });

                    section.appendChild(grid);
                    contentArea.appendChild(section);
                } else {
                    contentArea.innerHTML = `<div style="padding:40px; text-align:center; color:#555;">No games found matching your filters.</div>`;
                }
                return; 
            }

            // Normal rendering (No active tag)
            let hasResults = false;
            
            allCategories.forEach(category => {
                const games = GAME_DATA[category].filter(g => {
                    const isSecretGame = g.hidden === "true" || (g.tags && g.tags.some(t => t.toLowerCase() === 'hidden'));
                    if (isSecretGame && !showHidden) return false;
                    return g.name.toLowerCase().includes(lowerFilter);
                });

                if (games.length > 0) {
                    hasResults = true;

                    const section = document.createElement('div');
                    section.className = 'category-section';
                    section.id = `cat-${category}`;

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = category;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'game-grid';

                    games.forEach(game => {
                        grid.appendChild(createGameCard(game));
                    });

                    section.appendChild(grid);
                    contentArea.appendChild(section);
                }
            });

            if (!hasResults) {
                contentArea.innerHTML = `<div style="padding:40px; text-align:center; color:#555;">No games found matching your filters.</div>`;
            }
        }

        function renderCanvasText(canvas, name) {
            const font = '400 16px "Source Sans 3", Helvetica, Arial, sans-serif';
            const lineHeight = 24;
            const horizontalPadding = 0;
            const topPadding = 4;
            const bottomPadding = 0;

            const card = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const cardStyles = window.getComputedStyle(card);
            const padLeft = parseFloat(cardStyles.paddingLeft) || 0;
            const padRight = parseFloat(cardStyles.paddingRight) || 0;
            const renderedCardWidth = Math.round(card.getBoundingClientRect().width) || 180;
            const contentWidth = renderedCardWidth - (padLeft + padRight);
            const cssWidth = Math.max(120, Math.floor(contentWidth));
            
            const measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = font;
            const maxWidth = cssWidth - horizontalPadding * 2;
            const words = name.split(/\s+/).filter(Boolean);
            const lines = [];
            let currentLine = '';

            const pushBrokenWord = (word) => {
                let chunk = '';
                for (const ch of word) {
                    const candidate = chunk + ch;
                    if (measureCtx.measureText(candidate).width <= maxWidth) {
                        chunk = candidate;
                    } else {
                        if (chunk) lines.push(chunk);
                        chunk = ch;
                    }
                }
                if (chunk) lines.push(chunk);
            };

            words.forEach((word) => {
                const candidate = currentLine ? `${currentLine} ${word}` : word;
                if (measureCtx.measureText(candidate).width <= maxWidth) {
                    currentLine = candidate;
                    return;
                }
                if (currentLine) lines.push(currentLine);

                if (measureCtx.measureText(word).width <= maxWidth) {
                    currentLine = word;
                } else {
                    pushBrokenWord(word);
                    currentLine = '';
                }
            });

            if (currentLine) lines.push(currentLine);
            if (lines.length === 0) lines.push(name);

            const cssHeight = Math.max(24, lines.length * lineHeight + topPadding + bottomPadding);
            canvas.style.width = `${cssWidth}px`;
            canvas.style.height = `${cssHeight}px`;
            canvas.width = Math.round(cssWidth * dpr);
            canvas.height = Math.round(cssHeight * dpr);

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = font;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';

            let y = topPadding;
            lines.forEach((line) => {
                ctx.fillText(line, horizontalPadding, y);
                y += lineHeight;
            });
        }

        function launchGame(game) {
            const filename = game.file;
            const gamename = game.name;
            const isCloaked = cloakToggle.checked;
            
            gtag('event', 'game_played', {
                game_name: gamename
            });

            if (!isCloaked && game.openog === "true") {
                window.open(getGameUrl(filename, game.provider), '_blank');
                return;
            }

            if (isCloaked) {
                loader.style.display = 'flex';
                document.getElementById('loader-text').textContent = "Cloaking...";

                const url = getGameUrl(filename, game.provider);

                fetch(url)
                    .then(res => {
                        if(!res.ok) throw new Error("Failed to fetch");
                        return res.text();
                    })
                    .then(html => {
                        const cleanedHtml = cleanGameHtml(html);

                        loader.style.display = 'none';
                        const win = window.open("about:blank", "_blank");
                        if(!win) {
                            alert("Pop-up blocked. Please allow popups.");
                            return;
                        }
                        win.document.open();
                        win.document.write(cleanedHtml);
                        win.document.close();
                    })
                    .catch(err => {
                        loader.style.display = 'none';
                        alert("Error loading game code: " + err);
                    });

            } else {
                const cleanName = filename.trim();
                const encoded = encodeURIComponent(cleanName);
                const provider = game.provider ? encodeURIComponent(game.provider.trim()) : 'ugs';
                window.open(`?g=${encoded}&p=${provider}`, '_blank');
            }
        }

        // Update Notification Logic
        const updateNotification = document.getElementById('update-notification');
        const updateTextSpan = document.getElementById('update-text');
        const closeUpdateBtn = document.getElementById('close-update-btn');
        const updateModal = document.getElementById('update-modal');
        const updateModalClose = document.getElementById('update-modal-close');
        const updateModalText = document.getElementById('update-modal-text');

        let fetchedUpdateDate = null;
        let fetchedUpdateContent = "";

        fetch('new_added_games.txt')
            .then(res => {
                if (!res.ok) throw new Error("Could not load updates file");
                return res.text();
            })
            .then(text => {
                fetchedUpdateContent = text;
                const lines = text.split('\n');
                if (lines.length > 0 && lines[0].startsWith('Update:')) {
                    fetchedUpdateDate = lines[0].trim();
                    updateTextSpan.textContent = fetchedUpdateDate;
                    
                    fetchedUpdateContent = lines.slice(2).join('\n').trim();

                    if (localStorage.getItem('updateClosed') !== fetchedUpdateDate) {
                        updateNotification.style.display = 'flex';
                    }
                }
            })
            .catch(err => {
                console.error("Error loading new games: ", err);
            });

        closeUpdateBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            updateNotification.style.display = 'none';
            if (fetchedUpdateDate) {
                localStorage.setItem('updateClosed', fetchedUpdateDate);
            }
        });

        updateNotification.addEventListener('click', () => {
            updateModal.style.display = 'flex';
            updateModalText.textContent = fetchedUpdateContent;
        });

        updateModalClose.addEventListener('click', () => {
            updateModal.style.display = 'none';
        });

        updateModal.addEventListener('click', (e) => {
            if (e.target === updateModal) {
                updateModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
