<!DOCTYPE html>
<html lang="en">
   <head>

   </head>
   <body>
      <!-- Theme Switcher -->
      <div id="styleSwitcher">
         <label for="themeSelect">Theme:</label>
         <select id="themeSelect">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="pastel">Pastel</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="orange">Orange</option>
            <option value="green">Green</option>
         </select>
      </div>
      <!-- Main Content -->
      <div class="container">
         <h1>Games</h1>
         <!-- Minecraft Section -->
         <div class="dropdown">
            <div class="dropdown-header">
               Minecraft <span class="arrow">&#9660;</span>
            </div>
            <div class="dropdown-content">
               <p><a href="https://irv77.github.io/AmplerLauncher/">Minecraft Launcher (USE THIS)</a></p>
               <hr class="rounded" />
               <p><a href="minecraft/eaglercraft.html">Minecraft (1.8)</a></p>
               <p><a href="minecraft/eaglercraft12.html">Minecraft (1.12)</a></p>
               <p><a href="minecraft/eaglerforge.html">Minecraft (Modded)</a></p>
            </div>
         </div>
         <!-- FNAF Games Section -->
         <div class="dropdown">
            <div class="dropdown-header">
               FNAF Games <span class="arrow">&#9660;</span>
            </div>
            <div class="dropdown-content">
               <p><a href="https://irv77.github.io/hd_fnaf/1/">FNAF 1</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/2/">FNAF 2</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/3/">FNAF 3</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/4/">FNAF 4</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/sl/">FNAF SL</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/ps/">FNAF PS</a></p>
               <p><a href="https://irv77.github.io/hd_fnaf/ucn/">FNAF UCN</a></p>
            </div>
         </div>
         <!-- Retro Games-->
                   <div class="dropdown">
            <div class="dropdown-header">
               Retro Games <span class="arrow">&#9660;</span>
            </div>
            <div class="dropdown-content">
              <p><a href="/hl/index.html">Half-Life</a></p>
              <p><a href="https://qwasm.m-h.org.uk/">Quake</a></p>
              <p><a href="https://dwasm.m-h.org.uk/">Doom</a></p>
              <p><a href="./webretro/index.html">Retroarch</a></p>
              <p>
                <a id="combinedLink" href="#">Flash Emulator <strong>(Games)</strong></a>
              </p>
            </div>
         </div>
         <!-- Other Games -->
         <p><a href="/cc3d/index.html">Crazy Cattle 3D</a></p>
         <p><a href="https://sparticle999.github.io/SpaceCompany/">Space Colony</a></p>
         <p><a href="https://app.nextchat.dev/">Generative AI</a></p>
         <!-- Open in about:blank -->
         <button class="button-16" onclick="openInBlank()">Open in about:blank</button>
      </div>

      <!-- JavaScript -->
      <script>
         const themeSelect = document.getElementById('themeSelect');
         const styleSheet = document.getElementById('styleSheet');
         
         const themes = {
           dark: './styles/style-dark.css',
           light: './styles/style-light.css',
           pastel: './styles/style-pastel.css',
           purple: './styles/style-purple.css',
           blue: './styles/style-blue.css',
           orange: './styles/style-orange.css',
           green: './styles/style-green.css'
         };
         
         function applyTheme(theme) {
           styleSheet.href = themes[theme] || './styles/style.css';
         }
         
         const savedTheme = localStorage.getItem('theme');
         if (savedTheme && themes[savedTheme]) {
           themeSelect.value = savedTheme;
           applyTheme(savedTheme);
         }
         
         themeSelect.addEventListener('change', () => {
           const selectedTheme = themeSelect.value;
           localStorage.setItem('theme', selectedTheme);
           applyTheme(selectedTheme);
         });
         
         function openInBlank() {
           const win = window.open();
           const iframe = win.document.createElement('iframe');
           Object.assign(iframe.style, {
             border: 'none',
             width: '100%',
             height: '100%',
             margin: '0'
           });
           iframe.referrerPolicy = 'no-referrer';
           iframe.allow = 'fullscreen';
           iframe.src = document.URL;
         
           win.document.body.style.margin = '0';
           win.document.body.style.height = '100vh';
           win.document.body.appendChild(iframe);
         }
        document.querySelectorAll('.dropdown').forEach(dropdown => {
          const header = dropdown.querySelector('.dropdown-header');
          const content = dropdown.querySelector('.dropdown-content');
          let isOpen = false; // Track the dropdown state

          header.addEventListener('click', () => {
            isOpen = !isOpen; // Toggle the state

            if (isOpen) {
              // EXPANDING
              content.style.maxHeight = content.scrollHeight + 'px';
              dropdown.classList.add('open');
            } else {
              // COLLAPSING
              content.style.maxHeight = content.scrollHeight + 'px'; // Get current height before collapsing
              requestAnimationFrame(() => {
                content.style.maxHeight = '0';
                dropdown.classList.remove('open');
              });
            }
          });
        });
        const combinedLink = document.getElementById('combinedLink');
        combinedLink.addEventListener('click', (event) => {
          event.preventDefault(); // Prevent default link behavior
          const flashLink = "https://flash.fsh.plus/";
          const gamesLink = "https://github.com/BinBashBanana/gstore/tree/master";

          // Decide which link to open based on click location (simplified example)
          const linkToOpen = event.offsetX < combinedLink.offsetWidth / 7 ? flashLink : gamesLink;
          window.open(linkToOpen, '_blank'); // Open in a new tab
        });
      </script>
   </body>
</html>
