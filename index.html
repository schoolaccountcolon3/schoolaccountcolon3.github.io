<script>
        const PROVIDER_URLS = {
            "math": "https://cdn.jsdelivr.net/gh/lemonsky47/storage@storage/",
            "ugs": "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/",
            "ugs2": "https://cdn.jsdelivr.net/gh/DogeSploit/UGS-Main@main/"
        };
        const loader = document.getElementById('loader');

        // Searches the list if available (fallback for direct URL hits without &p parameter)
        function findGameByFile(filename) {
            if (typeof GAME_DATA === 'undefined') return null;
            for (const category in GAME_DATA) {
                const found = GAME_DATA[category].find(g => g.file === filename);
                if (found) return found;
            }
            return null;
        }

        function getGameUrl(filename, provider) {
            if (filename.startsWith("./")) {
                const cleanPath = filename.replace(/^\.\/+/, "");
                return `${MAIN_URL}${cleanPath}?t=${Date.now()}`;
            }

            // Keep local/relative assets and absolute external URLs unchanged
            if (filename.startsWith("http://") || filename.startsWith("https://") || filename.startsWith("/")) {
                return filename;
            }

            // Fallback lookup if provider was not explicitly passed in URL
            if (!provider) {
                const game = findGameByFile(filename);
                if (game) {
                    provider = game.provider;
                }
            }

            if (provider === "eag") {
                const baseName = filename.replace(".html", "");
                return `https://cdn.jsdelivr.net/gh/lemonsky47/homework/${baseName}/${filename}?t=${Date.now()}`;
            }

            // Match base URL or default to UGS if provider remains unmatched
            const baseUrl = PROVIDER_URLS[provider] || PROVIDER_URLS["ugs"];
            // ugs2 files live in subfolders that can contain spaces (e.g. "emulated/Genesis Plus/")
            const path = provider === "ugs2"
                ? filename.split("/").map(encodeURIComponent).join("/")
                : filename;
            return `${baseUrl}${path}?t=${Date.now()}`;
        }

        function cleanGameHtml(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            function transformGithackToJsdelivr(url) {
                if (url.includes('rawcdn.githack.com')) {
                    const match = url.match(/https:\/\/rawcdn\.githack\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)/);
                    if (match) {
                        const [, user, repo, branch, path] = match;
                        return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
                    }
                }
                return url;
            }

            const elements = doc.querySelectorAll('[src], [href]');
            elements.forEach(el => {
                if (el.src) el.src = transformGithackToJsdelivr(el.src);
                if (el.href) el.href = transformGithackToJsdelivr(el.href);
            });

            // Remove sidebar ads
            doc.querySelectorAll('[id^="sidebarad"], [class*="sidebarad"]')
               .forEach(el => el.remove());

            // Remove known SDKs
            const sdkPatterns = ['gamemonetize', 'st39/sdk', 'ga.js', 'sdk.js'];
            doc.querySelectorAll('script[src]').forEach(el => {
                if (sdkPatterns.some(p => el.src.includes(p))) el.remove();
            });

            // --- DRM & SITE-LOCK CRACKER ---

            // 1. Find the dynamic payload function name from the bottom scripts
            let payloadFuncName = null;
            doc.querySelectorAll('script:not([src])').forEach(el => {
                const text = el.textContent || '';
                // Looks for: window["xa0f20fba9693cbb2c66516f1"]
                const match = text.match(/window\["([a-zA-Z0-9]{20,})"\]/);
                if (match) payloadFuncName = match[1];
            });

            // 2. Find the brain script, extract its cipher key, and replace it
            doc.querySelectorAll('script:not([src])').forEach(el => {
                const text = el.textContent || '';
                const obfuscatedMatches = (text.match(/_0x[0-9a-f]+/gi) || []).length;

                // If it has a ton of _0x variables, it's the brain script
                if (obfuscatedMatches > 10) {
                    // Extract the XOR cipher key array (e.g. [0xd8,0xd9,0xa1,0xc4...])
                    const keyMatch = text.match(/\[(0x[0-9a-f]+(?:,0x[0-9a-f]+)+)\]/i);

                    if (keyMatch && payloadFuncName) {
                        // REWRITE the script with a clean bypass decryptor!
                        el.textContent = `
                            // Injected DRM Bypass by cleanGameHtml
                            window["${payloadFuncName}"] = function(payload) {
                                if (!payload) return true;
                                const key = [${keyMatch[1]}];
                                const binaryString = atob(payload);
                                const buffer = new Uint8Array(binaryString.length);

                                // Decrypt via XOR
                                for (let i = 0; i < binaryString.length; i++) {
                                    buffer[i] = binaryString.charCodeAt(i) ^ key[i % key.length];
                                }

                                // Write the clean game engine code directly to the page
                                document.write(new TextDecoder().decode(buffer));
                            };
                        `;
                    } else {
                        // Failsafe: Remove it completely if we couldn't parse the keys
                        el.remove();
                    }
                }
            });

            let doctype = "";
            if (doc.doctype) {
                doctype = `<!DOCTYPE ${doc.doctype.name}>\n`;
            }
            return doctype + doc.documentElement.outerHTML;
        }

        function initializeGameMode(filename, provider, needsDecode) {
            ['rail', 'header', 'main'].forEach(id => document.getElementById(id).style.display = 'none');
            loader.style.display = 'flex';

            const realFilename = needsDecode ? decodeURIComponent(filename) : filename;
            const realProvider = needsDecode && provider ? decodeURIComponent(provider) : provider;
            const url = getGameUrl(realFilename, realProvider);

            document.getElementById('loader-text').textContent = "Launching...";

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(html => {
                    const cleanedHtml = cleanGameHtml(html);
                    document.open();
                    document.write(cleanedHtml);
                    document.close();
                })
                .catch(err => {
                    loader.innerHTML = `<div style="text-align:center; padding:20px;">
                        <h2>Error Loading Game</h2>
                        <p>Could not fetch game data.</p>
                        <button onclick="window.location.href = window.location.pathname" style="padding:10px; cursor:pointer; margin-top:10px;">Return to Menu</button>
                    </div>`;
                    console.error(err);
                });
        }

</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const content = $('content'), rail = $('rail'), tagsEl = $('tags');
  const search = $('search'), searchCount = $('search-count'), searchKbd = $('search-kbd');
  const header = $('header');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let activeTag = null;
  let showHidden = false;
  let allGames = [];
  const canvases = new Set();

  /* ---------- Canvas text ---------- */
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim()
    || getComputedStyle(document.body).getPropertyValue(name).trim();

  function fitLine(ctx, text, max) {
    if (ctx.measureText(text).width <= max) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(text.slice(0, mid) + '…').width <= max) lo = mid; else hi = mid - 1;
    }
    return text.slice(0, lo).trimEnd() + '…';
  }

  // Draws up to `maxLines` wrapped lines, ellipsizing the last one.
  function drawText(canvas, text, { size, weight = 400, color, lineH, maxLines = 1, width }) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(20, Math.floor(width ?? canvas.parentElement.clientWidth));
    const ctx = canvas.getContext('2d');
    const font = `${weight} ${size}px ${css('--font')}`;
    ctx.font = font;

    const lines = [];
    let line = '';
    const words = text.split(/\s+/).filter(Boolean);
    for (let i = 0; i < words.length; i++) {
      const cand = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(cand).width <= w || !line) { line = cand; continue; }
      lines.push(line);
      line = words[i];
      if (lines.length === maxLines - 1) { line = words.slice(i).join(' '); break; }
    }
    lines.push(line);
    const out = lines.slice(0, maxLines).map((l, i, a) => i === a.length - 1 ? fitLine(ctx, l, w) : l);

    const h = out.length * lineH;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    out.forEach((l, i) => ctx.fillText(l, 0, i * lineH + lineH / 2 + 0.5));
  }

  function drawCanvas(c) {
    const kind = c.dataset.kind;
    if (kind === 'name') {
      drawText(c, c.dataset.text, { size: 15, weight: 500, color: css('--fg'), lineH: 20, maxLines: 2 });
    } else if (kind === 'tag') {
      const active = c.closest('.tag').classList.contains('active');
      const ctx = c.getContext('2d');
      ctx.font = `500 13px ${css('--font')}`;
      drawText(c, c.dataset.text, { size: 13, weight: 500, color: css(active ? '--fg' : '--muted'), lineH: 16, width: Math.ceil(ctx.measureText(c.dataset.text).width) + 1 });
    } else if (kind === 'count') {
      const ctx = c.getContext('2d');
      ctx.font = `400 12px ${css('--font')}`;
      drawText(c, c.dataset.text, { size: 12, color: css('--faint'), lineH: 16, width: Math.ceil(ctx.measureText(c.dataset.text).width) + 1 });
    }
    c.drawn = true;
  }

  // Observe relative to this document's own viewport. Without an explicit root, a page
  // embedded in another frame (the flattened SVG build) also gets clipped by the outer
  // frame, so cards near the bottom never count as visible and stay blank.
  const observer = (cb, opts) => {
    try { return new IntersectionObserver(cb, { root: document, ...opts }); }
    catch { return new IntersectionObserver(cb, opts); }
  };

  const io = observer((entries) => {
    for (const e of entries) {
      if (e.isIntersecting && !e.target.drawn) { drawCanvas(e.target); io.unobserve(e.target); }
    }
  }, { rootMargin: '300px' });

  function makeCanvas(kind, text, lazy = true) {
    const c = document.createElement('canvas');
    c.dataset.kind = kind;
    c.dataset.text = text;
    canvases.add(c);
    if (lazy) io.observe(c);
    return c;
  }

  function redrawAll() {
    for (const c of canvases) {
      if (!c.isConnected) { canvases.delete(c); continue; }
      c.drawn = false;
      io.observe(c);
    }
  }

  /* ---------- Data ---------- */
  const isHidden = (g) => g.hidden === 'true' || g.tags.some(t => t.toLowerCase() === 'hidden');
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });

  function categoryOrder(keys) {
    return keys.sort((a, b) => (a.length === 1) !== (b.length === 1)
      ? (a.length === 1 ? -1 : 1)
      : a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  }

  /* ---------- Rendering ---------- */
  function gameButton(g) {
    const b = document.createElement('button');
    b.className = 'game';
    b.type = 'button';
    const name = document.createElement('span');
    name.className = 'name';
    name.appendChild(makeCanvas('name', g.name));
    b.appendChild(name);
    b.addEventListener('click', () => launch(g));
    return b;
  }

  function section(id, title, games, extra) {
    const s = document.createElement('section');
    s.className = 'section';
    if (id) s.id = 'cat-' + id;
    s.dataset.cat = id || '';
    const head = document.createElement('div');
    head.className = 'section-head';
    const h = document.createElement('h2');
    h.textContent = title;
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = games.length;
    head.append(h, n);
    if (extra) head.appendChild(extra);
    const grid = document.createElement('div');
    grid.className = 'grid';
    const frag = document.createDocumentFragment();
    games.forEach(g => frag.appendChild(gameButton(g)));
    grid.appendChild(frag);
    s.append(head, grid);
    return s;
  }

  function render() {
    for (const c of canvases) io.unobserve(c);
    canvases.clear();
    content.textContent = '';
    spy.disconnect();

    const q = search.value.trim().toLowerCase();
    const visible = allGames.filter(g => (showHidden || !isHidden(g))
      && (!activeTag || g.tags.includes(activeTag))
      && (!q || g.name.toLowerCase().includes(q)));

    searchKbd.hidden = !!q || document.activeElement === search;
    searchCount.hidden = !q && !activeTag;
    searchCount.textContent = visible.length.toLocaleString();

    const present = new Set();

    if (!q && !activeTag) {
      const recent = store.get('recentGames', [])
        .map(r => allGames.find(g => g.name === r))
        .filter(Boolean);
      if (recent.length) content.appendChild(section(null, 'Recently played', recent));
    }
    $('clear-recent').hidden = !store.get('recentGames', []).length;

    if (activeTag || q) {
      // Filtered results read better as one flat, sorted list
      if (visible.length) {
        content.appendChild(section(null, activeTag ? activeTag : 'Results', visible.slice().sort(byName)));
      }
    } else {
      for (const cat of categoryOrder([...new Set(visible.map(g => g.cat))])) {
        present.add(cat);
        content.appendChild(section(cat, cat, visible.filter(g => g.cat === cat)));
      }
    }

    if (!visible.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing matches that.';
      content.appendChild(e);
    }

    for (const b of rail.querySelectorAll('.rail-btn')) {
      b.disabled = !!(q || activeTag) || !present.has(b.dataset.cat);
      b.classList.remove('current');
    }
    content.querySelectorAll('.section[id]').forEach(s => spy.observe(s));
  }

  /* ---------- Rail + scrollspy ---------- */
  const spy = observer((entries) => {
    for (const e of entries) e.target.inView = e.isIntersecting;
    const first = [...content.querySelectorAll('.section[id]')].find(s => s.inView);
    rail.querySelectorAll('.rail-btn').forEach(b => b.classList.toggle('current', !!first && b.dataset.cat === first.dataset.cat));
  }, { rootMargin: '-120px 0px -55% 0px' });

  function buildRail(cats) {
    rail.textContent = '';
    const letters = cats.filter(c => c.length === 1);
    const other = cats.filter(c => c.length > 1);
    const add = (c) => {
      const b = document.createElement('button');
      b.className = 'rail-btn';
      b.dataset.cat = c;
      b.title = c;
      b.textContent = c.charAt(0).toUpperCase();
      b.onclick = () => $('cat-' + c)?.scrollIntoView({ block: 'start' });
      rail.appendChild(b);
    };
    letters.forEach(add);
    if (other.length) {
      const sep = document.createElement('div');
      sep.className = 'rail-sep';
      rail.appendChild(sep);
      other.forEach(add);
    }
  }

  /* ---------- Tags ---------- */
  function buildTags() {
    const counts = new Map();
    allGames.forEach(g => g.tags.forEach(t => {
      if (t.toLowerCase() !== 'hidden') counts.set(t, (counts.get(t) || 0) + 1);
    }));
    tagsEl.textContent = '';
    [...counts].sort((a, b) => b[1] - a[1]).forEach(([t, n]) => {
      const b = document.createElement('button');
      b.className = 'tag';
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.append(makeCanvas('tag', t, false), makeCanvas('count', String(n), false));
      b.onclick = () => {
        activeTag = activeTag === t ? null : t;
        tagsEl.querySelectorAll('.tag').forEach(x => {
          const on = x === b && activeTag === t;
          x.classList.toggle('active', on);
          x.setAttribute('aria-pressed', on);
          x.querySelectorAll('canvas').forEach(drawCanvas);
        });
        render();
        window.scrollTo(0, 0);
      };
      tagsEl.appendChild(b);
    });
    tagsEl.querySelectorAll('canvas').forEach(drawCanvas);
  }

  /* ---------- Launch ---------- */
  function launch(game) {
    const recent = store.get('recentGames', []).filter(n => n !== game.name);
    recent.unshift(game.name);
    store.set('recentGames', recent.slice(0, 8));
    setTimeout(render, 0);

    const filename = game.file;
    const isCloaked = $('cloak').checked;

    gtag('event', 'game_played', { game_name: game.name });

    if (!isCloaked && game.openog === "true") {
      window.open(getGameUrl(filename, game.provider), '_blank');
      return;
    }

    if (isCloaked) {
      loader.style.display = 'flex';
      $('loader-text').textContent = "Cloaking...";
      fetch(getGameUrl(filename, game.provider))
        .then(res => {
          if (!res.ok) throw new Error("Failed to fetch");
          return res.text();
        })
        .then(html => {
          const cleanedHtml = cleanGameHtml(html);
          loader.style.display = 'none';
          const win = window.open("about:blank", "_blank");
          if (!win) {
            alert("Pop-up blocked. Please allow popups.");
            return;
          }
          win.document.open();
          win.document.write(cleanedHtml);
          win.document.close();
        })
        .catch(err => {
          loader.style.display = 'none';
          alert("Error loading game code: " + err);
        });
    } else {
      const provider = game.provider ? encodeURIComponent(game.provider.trim()) : 'ugs';
      window.open(`?g=${encodeURIComponent(filename.trim())}&p=${provider}`, '_blank');
    }
  }

  /* ---------- What's new ---------- */
  // The file is plain text with optional <a href> tags and bare URLs. Only links
  // become elements; everything else is inserted as text, so the file can't inject markup.
  function renderNews(el, text) {
    el.textContent = '';
    const link = (href, label) => {
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = label;
      return a;
    };
    // Fill `into` with one line of text: <a href> tags and bare URLs become links, the rest is text.
    const inline = (into, line) => {
      const tpl = document.createElement('template');
      tpl.innerHTML = line;
      const addText = (t) => {
        let last = 0;
        for (const m of t.matchAll(/https?:\/\/[^\s<>"]+/g)) {
          into.append(t.slice(last, m.index), link(m[0], m[0]));
          last = m.index + m[0].length;
        }
        into.append(t.slice(last));
      };
      const walk = (node) => {
        for (const n of node.childNodes) {
          if (n.nodeType === Node.TEXT_NODE) addText(n.textContent);
          else if (n.nodeName === 'A' && /^https?:\/\//i.test(n.getAttribute('href') || '')) into.append(link(n.getAttribute('href'), n.textContent));
          else walk(n);
        }
      };
      walk(tpl.content);
    };

    const lines = text.split('\n').map(l => l.trimEnd());
    let list = null;
    lines.forEach((line, i) => {
      if (/^-{3,}$/.test(line.trim())) return;                 // underline for a heading
      if (!line.trim()) { list = null; return; }
      if (/^-{3,}$/.test((lines[i + 1] || '').trim())) {       // heading
        const h = document.createElement('h3');
        h.textContent = line.trim();
        el.appendChild(h);
        list = null;
      } else if (/^\s*[-*]\s+/.test(line)) {                  // bullet
        if (!list) { list = document.createElement('ul'); el.appendChild(list); }
        const li = document.createElement('li');
        inline(li, line.replace(/^\s*[-*]\s+/, ''));
        list.appendChild(li);
      } else {
        const p = document.createElement('p');
        inline(p, line);
        el.appendChild(p);
        list = null;
      }
    });
  }

  fetch(MAIN_URL + 'new_added_games.txt?t=' + Date.now())
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(text => {
      const lines = text.split('\n');
      if (!lines[0].startsWith('Update:')) return;
      const date = lines[0].replace('Update:', '').trim();
      const btn = $('whats-new');
      btn.hidden = false;
      btn.querySelector('.dot').hidden = store.get('updateSeen', null) === date;
      $('news-title').textContent = "What's new · " + date;
      renderNews($('news-body'), lines.slice(2).join('\n').trim());
      btn.onclick = () => {
        $('news').showModal();
        store.set('updateSeen', date);
        btn.querySelector('.dot').hidden = true;
      };
    })
    .catch(() => {});
  $('news-close').onclick = () => $('news').close();
  $('news').addEventListener('click', (e) => { if (e.target === $('news')) $('news').close(); });

  $('clear-recent').onclick = () => { store.set('recentGames', []); render(); };

  /* ---------- Input ---------- */
  let t;
  search.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { render(); window.scrollTo(0, 0); }, 90); });
  search.addEventListener('focus', () => { searchKbd.hidden = true; });
  search.addEventListener('blur', () => { searchKbd.hidden = !!search.value; });

  let keyBuffer = '';
  document.addEventListener('keydown', (e) => {
    const typing = document.activeElement === search;
    if (e.key === '/' && !typing) { e.preventDefault(); search.focus(); search.select(); return; }
    if (e.key === 'Escape' && typing) { search.value = ''; search.blur(); render(); return; }
    if (!typing && e.key.length === 1) {
      keyBuffer = (keyBuffer + e.key.toLowerCase()).slice(-12);
      if (!showHidden && keyBuffer === 'secrethidden') { showHidden = true; render(); }
    }
  });

  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--header-h', header.getBoundingClientRect().height + 'px');
  }).observe(header);

  let rw;
  window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(redrawAll, 150); });


  /* ---------- Boot ---------- */
  // Opening a game (?g=): skip the menu and games.js entirely
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('g')) {
    initializeGameMode(urlParams.get('g'), urlParams.get('p'), true);
    return;
  }
  $('loader').classList.add('on');
  const s = document.createElement('script');
  s.src = MAIN_URL + 'games.js?t=' + Date.now();
  s.onload = async () => {
    try { await document.fonts.ready; } catch {}
    allGames = Object.entries(GAME_DATA).flatMap(([cat, games]) => games.map(g => ({ ...g, cat })));
    buildRail(categoryOrder(Object.keys(GAME_DATA)));
    buildTags();
    render();
    $('loader').classList.remove('on');
  };
  s.onerror = () => { $('loader').textContent = "Couldn't load games.js"; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
