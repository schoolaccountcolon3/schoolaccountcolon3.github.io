    <!-- Button to Open in about:blank -->
    <button class="button-16" onclick="openInBlank()">Open in about:blank</button>
  </div>

  <!-- JavaScript for Theme and Button Actions -->
  <script>
    function openInBlank() {
      const url = document.URL;
      const win = window.open();
      win.document.body.style.margin = "0";
      win.document.body.style.height = "100vh";

      const iframe = win.document.createElement("iframe");
      iframe.style.border = "none";
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.margin = "0";
      iframe.referrerPolicy = "no-referrer";
      iframe.allow = "fullscreen";
      iframe.src = url;
      win.document.body.appendChild(iframe);
    }

    const themeSelect = document.getElementById('themeSelect');
    const styleSheet = document.getElementById('styleSheet');

    // Load saved theme from local storage
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);
    }

    // Event listener for theme change
    themeSelect.addEventListener('change', () => {
      const selectedTheme = themeSelect.value;
      localStorage.setItem('theme', selectedTheme);
      applyTheme(selectedTheme);
    });

    // Function to apply the selected theme
    function applyTheme(theme) {
      let stylesheetPath;
      switch (theme) {
        case 'dark':
          stylesheetPath = './styles/style-dark.css';
          break;
        case 'light':
          stylesheetPath = './styles/style-light.css';
          break;
        case 'pastel':
          stylesheetPath = './styles/style-pastel.css';
          break;
        case 'purple':
          stylesheetPath = './styles/style-purple.css';
          break;
        case 'blue':
          stylesheetPath = './styles/style-blue.css';
          break;
        case 'orange':
          stylesheetPath = './styles/style-orange.css';
          break;
        case 'green':
          stylesheetPath = './styles/style-green.css';
          break;
        default:
          stylesheetPath = './styles/style.css';
      }
      styleSheet.href = stylesheetPath;
    }
  </script>
</body>
