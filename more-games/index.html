<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/more-games.css" />
    <script src="/theme.js"></script>
    <title>Ultimate Game Stash</title>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Loading...</div>
    </div>

    <div id="styleSwitcher"></div>

    <nav id="sidebar">
        <div class="sidebar-header">Game Stash</div>
        <div class="nav-scroll" id="nav-container">
            <!-- Injected via JS -->
        </div>
    </nav>

    <main id="main">
        <div id="topbar">
            <input type="text" id="search-input" placeholder="Search games...">
            
            <!-- NEW CHECKBOX -->
            <label class="cloak-label">
                <input type="checkbox" id="cloak-toggle"> 
                Open in about:blank
            </label>
        </div>
        <div id="content-area">
            <!-- Injected via JS -->
        </div>
    </main>

    <script src="games.js"></script>
    <script>
        const BASE_URL = "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/";

        const navContainer = document.getElementById('nav-container');
        const contentArea = document.getElementById('content-area');
        const searchInput = document.getElementById('search-input');
        const loader = document.getElementById('loader');
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('main');
        const cloakToggle = document.getElementById('cloak-toggle');

        // Check for ?g= parameter immediately (Direct Link Mode)
        const urlParams = new URLSearchParams(window.location.search);
        const gameParam = urlParams.get('g');

        if (gameParam) {
            initializeGameMode(gameParam, true); // True = decode name
        } else {
            initializeMenuMode();
        }

        // Helper to determine real URL
        function getGameUrl(filename) {
            if (filename.startsWith("cl")) {
                // Old games
                return `${BASE_URL}${filename}?t=${Date.now()}`;
            } else {
                // New games (Full URL stored in file property)
                return filename;
            }
        }

        function initializeGameMode(filename, needsDecode) {
            sidebar.style.display = 'none';
            main.style.display = 'none';
            loader.style.display = 'flex';
            
            const realFilename = needsDecode ? decodeURIComponent(filename) : filename;
            const url = getGameUrl(realFilename);

            document.getElementById('loader-text').textContent = "Launching...";

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(html => {
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(err => {
                    loader.innerHTML = `<div style="text-align:center; padding:20px;">
                        <h2>Error Loading Game</h2>
                        <p>Could not fetch game data.</p>
                        <button onclick="window.location.href = window.location.pathname" style="padding:10px; cursor:pointer; margin-top:10px;">Return to Menu</button>
                    </div>`;
                    console.error(err);
                });
        }

        function initializeMenuMode() {
            loader.style.display = 'none';

            if (typeof GAME_DATA === 'undefined') {
                contentArea.innerHTML = '<h2 style="padding:20px; color:#ef4444;">Error: games.js not found. Run convert.py first!</h2>';
                return;
            }

            const keys = Object.keys(GAME_DATA);
            const standardCats = keys.filter(k => k.length === 1).sort();
            const specialCats = keys.filter(k => k.length > 1).sort();

            if (standardCats.length > 0) {
                const label = document.createElement('div');
                label.className = 'nav-label';
                label.textContent = 'Library';
                navContainer.appendChild(label);
                standardCats.forEach(cat => createNavBtn(cat));
            }

            if (specialCats.length > 0) {
                const label = document.createElement('div');
                label.className = 'nav-label';
                label.textContent = 'Collections & Emulators';
                navContainer.appendChild(label);
                specialCats.forEach(cat => createNavBtn(cat));
            }

            renderGames();

            searchInput.addEventListener('input', (e) => renderGames(e.target.value));
        }

        function createNavBtn(category) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.textContent = category;
            btn.onclick = () => {
                const el = document.getElementById(`cat-${category}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    el.style.opacity = '0.5';
                    setTimeout(() => el.style.opacity = '1', 300);
                }
            };
            navContainer.appendChild(btn);
        }

        function renderGames(filterText = '') {
            contentArea.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();

            const allCategories = Object.keys(GAME_DATA).sort((a, b) => {
                const isASingle = a.length === 1;
                const isBSingle = b.length === 1;
                if (isASingle && !isBSingle) return -1;
                if (!isASingle && isBSingle) return 1;
                return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
            });

            let hasResults = false;

            allCategories.forEach(category => {
                const games = GAME_DATA[category].filter(g =>
                    g.name.toLowerCase().includes(lowerFilter)
                );

                if (games.length > 0) {
                    hasResults = true;

                    const section = document.createElement('div');
                    section.className = 'category-section';
                    section.id = `cat-${category}`;

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = category;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'game-grid';

                    games.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.textContent = game.name;
                        card.onclick = () => launchGame(game.file, game.name);
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    contentArea.appendChild(section);
                }
            });

            if (!hasResults) {
                contentArea.innerHTML = `<div style="padding:40px; text-align:center; color:#555;">No games found matching "${filterText}"</div>`;
            }
        }

        // Logic to toggle between URL params and about:blank
        function launchGame(filename, gamename) {
            const isCloaked = cloakToggle.checked;

            if (isCloaked) {
                // 1. CLOAKED MODE (about:blank)
                loader.style.display = 'flex';
                document.getElementById('loader-text').textContent = "Cloaking...";
                
                const url = getGameUrl(filename);

                fetch(url)
                    .then(res => {
                        if(!res.ok) throw new Error("Failed to fetch");
                        return res.text();
                    })
                    .then(html => {
                        loader.style.display = 'none';
                        const win = window.open("about:blank", "_blank");
                        if(!win) {
                            alert("Pop-up blocked. Please allow popups.");
                            return;
                        }
                        win.document.open();
                        win.document.write(html);
                        win.document.close();
                    })
                    .catch(err => {
                        loader.style.display = 'none';
                        alert("Error loading game code: " + err);
                    });

            } else {
                // 2. STANDARD MODE (?g=...)
                const cleanName = filename.trim();
                const encoded = encodeURIComponent(cleanName);
                window.open(`?g=${encoded}`, '_blank');
            }
        }
    </script>
</body>
</html>
