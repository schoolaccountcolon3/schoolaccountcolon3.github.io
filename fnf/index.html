<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Mod Browser</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="mods-style.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="/theme.js"></script>
</head>
<body>
    <div id="particles-js"></div>
    <div id="main-content">
        <div class="container">
            <h1>FNF Mod Browser</h1>

            <div id="search-container">
                <input type="text" id="search-bar" placeholder="Search for a mod...">
            </div>

      <!-- global toggle to open original links -->
      <div id="original-toggle-container" style="position: fixed; top: 12px; left: 12px; z-index: 1000;">
        <label style="display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); padding: 6px 8px; border-radius: 6px; color: #fff;">
          <input type="checkbox" id="original-toggle">
          <span style="font-size: 0.9rem;">Open original links (Note: these are blocked on school wifi)</span>
        </label>
      </div>

            <div id="mods-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
    particlesJS('particles-js', {
        particles: {
          number: {
            value: 100,
            density: {
              enable: true,
              value_area: 800
            }
          },
          color: {
            value: '#ffffff'
          },
          shape: {
            type: 'circle'
          },
          opacity: {
            value: 0.15,
            random: true,
            anim: {
              enable: true,
              speed: 1.5,
              opacity_min: 0.05,
              sync: false
            }
          },
          size: {
            value: 3,
            random: true
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: '#ffffff',
            opacity: 0.15,
            width: 1
          },
          move: {
            enable: true,
            speed: 1.2,
            direction: 'none',
            random: true,
            straight: false,
            out_mode: 'out',
            bounce: false
          }
        },
        interactivity: {
          detect_on: 'canvas',
          events: {
            onhover: {
              enable: true,
              mode: 'grab'
            },
            onclick: {
              enable: true,
              mode: 'push'
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              line_linked: {
                opacity: 0.3
              }
            },
            push: {
              particles_nb: 4
            }
          }
        },
        retina_detect: true
      });
      </script>
</body>
</html>
