<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Configuration</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" id="styleSheet">
    <!-- Pickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css">
    <script src="./theme.js"></script>
    <style>
        body {
            padding-top: 80px;
        }
        .color-picker-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .color-picker {
            background-color: var(--color-card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--color-shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .color-picker label {
            display: block;
            color: var(--color-fg);
            font-weight: 500;
        }
        .color-picker .pickr {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: var(--color-input-bg);
            overflow: hidden;
        }
        .color-picker .pickr .pcr-button {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            background: none !important;
            background-size: 0 !important;
        }
        .color-picker .pickr .pcr-button::before {
            display: block;
            position: absolute;
            content: "";
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml;utf8, <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2 2\"><path fill=\"white\" d=\"M1,0H2V1H1V0ZM0,1H1V2H0V1Z\"/><path fill=\"gray\" d=\"M0,0H1V1H0V0ZM1,1H2V2H1V1Z\"/></svg>");
            background-size: 0.5em;
            border-radius: 4px;
            z-index: 0;
        }
        .color-picker .pickr .pcr-button::after {
            position: absolute;
            content: "";
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            transition: background .3s;
            background: var(--pcr-color);
            border-radius: 4px;
            z-index: 1;
        }
        .color-picker input[type="text"] {
            width: 100%;
            padding: 8px;
            background-color: var(--color-input-bg);
            color: var(--color-fg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-family: monospace;
            box-sizing: border-box;
        }
        .color-picker input[type="text"]:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px var(--color-focus);
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: var(--color-button-bg);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            z-index: 1000;
        }
        .back-button:hover {
            background-color: var(--color-button-hover);
        }
        .button-group {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            align-items: flex-end;
        }
        .preset-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--color-card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 4px var(--color-shadow);
        }
        .preset-selector label {
            color: var(--color-fg);
            font-weight: 500;
            white-space: nowrap;
        }
        .preset-selector select {
            background-color: var(--color-input-bg);
            color: var(--color-fg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            min-width: 120px;
        }
        .preset-selector select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px var(--color-focus);
        }
        .save-button, .reset-button {
            padding: 10px 20px;
            background-color: var(--color-button-bg);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .save-button:hover, .reset-button:hover {
            background-color: var(--color-button-hover);
        }
        .reset-button {
            background-color: var(--color-error);
        }
        .reset-button:hover {
            background-color: #d32f2f;
        }
        /* Dark theme for Pickr */
        .pcr-app[data-theme="classic"] {
            background-color: var(--color-card-bg) !important;
            border: 1px solid var(--color-border) !important;
            box-shadow: 0 4px 12px var(--color-shadow) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-preview {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction input {
            background-color: var(--color-input-bg) !important;
            color: var(--color-fg) !important;
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-result {
            background-color: var(--color-input-bg) !important;
            color: var(--color-fg) !important;
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-type.active {
            background-color: var(--color-button-bg) !important;
            color: var(--color-fg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-save {
            background-color: var(--color-button-bg) !important;
            color: var(--color-fg) !important;
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-save:hover {
            background-color: var(--color-button-hover) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-clear {
            background-color: var(--color-button-bg) !important;
            color: var(--color-fg) !important;
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-clear:hover {
            background-color: var(--color-button-hover) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-palette {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-opacity {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-preview {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-palette .pcr-palette {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-selection .pcr-color-opacity .pcr-opacity {
            border: 1px solid var(--color-border) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-type {
            color: var(--color-fg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-type:hover {
            background-color: var(--color-button-bg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-type.active {
            background-color: var(--color-button-bg) !important;
            color: var(--color-fg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-type.active:hover {
            background-color: var(--color-button-hover) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-result {
            background-color: var(--color-input-bg) !important;
            color: var(--color-fg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-result:focus {
            border-color: var(--color-primary) !important;
            box-shadow: 0 0 5px var(--color-focus) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-save,
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-clear {
            background-color: var(--color-button-bg) !important;
            color: var(--color-fg) !important;
        }
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-save:hover,
        .pcr-app[data-theme="classic"] .pcr-interaction .pcr-clear:hover {
            background-color: var(--color-button-hover) !important;
        }
        .color-picker .preview {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
        }
        .color-picker .preview-text {
            color: var(--color-fg);
            margin-bottom: 5px;
        }
        .color-picker .preview-link {
            color: var(--color-link);
            text-decoration: none;
            display: inline-block;
            margin: 5px 0;
        }
        .color-picker .preview-link:hover {
            color: var(--color-link-hover);
        }
        .color-picker .preview-button {
            background-color: var(--color-button-bg);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
        }
        .color-picker .preview-button:hover {
            background-color: var(--color-button-hover);
            color: var(--color-button-text-hover);
        }
        .color-picker .preview-input {
            background-color: var(--color-input-bg);
            color: var(--color-fg);
            border: 1px solid var(--color-border);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .color-picker .preview-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px var(--color-focus);
        }
        .color-picker .preview-card {
            background-color: var(--color-card-bg);
            padding: 10px;
            border-radius: 4px;
            margin: 5px 0;
        }
        .color-picker .preview-error {
            color: var(--color-error);
        }
        .color-picker .preview-muted {
            color: var(--color-fg-muted);
        }
        /* Export CSS Button */
        .export-css {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--color-card-bg);
            color: var(--color-fg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            opacity: 0.7;
            transition: opacity 0.2s;
            z-index: 1000;
        }
        .export-css:hover {
            opacity: 1;
        }
        .export-css-tooltip {
            position: fixed;
            bottom: 60px;
            right: 20px;
            background-color: var(--color-card-bg);
            color: var(--color-fg);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
        }
        .export-css-tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">← Back</a>
    <div class="button-group">
        <div style="display: flex; gap: 10px;">
            <button class="reset-button" onclick="resetTheme()">Reset Theme</button>
            <button class="save-button" onclick="saveCustomTheme()">Save Theme</button>
        </div>
        <div class="preset-selector">
            <label for="presetSelect">Load Preset:</label>
            <select id="presetSelect" onchange="loadPresetTheme()">
                <option value="">Select a preset...</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="pastel">Pastel</option>
                <option value="purple">Purple</option>
                <option value="blue">Blue</option>
                <option value="orange">Orange</option>
                <option value="green">Green</option>
            </select>
        </div>
    </div>
    <button class="export-css" onclick="exportCSS()">Export CSS</button>
    <div class="export-css-tooltip" id="exportTooltip">CSS copied to clipboard!</div>
    <div class="color-picker-container" id="colorPickers"></div>

    <!-- Pickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script>
        const defaultTheme = {
            'color-bg': '#121212',
            'color-fg': '#e0e0e0',
            'color-primary': '#f1f1f1',
            'color-primary-hover': '#c0c0c0',
            'color-card-bg': '#1e1e1e',
            'color-link': '#f1f1f1',
            'color-link-hover': '#c0c0c0',
            'color-button-bg': '#5e5e5e',
            'color-button-hover': '#2c2c2c',
            'color-button-text-hover': '#e0e0e0',
            'color-border': '#333',
            'color-input-bg': '#121212',
            'color-shadow': 'rgba(0, 0, 0, 0.3)',
            'color-inset-shadow': 'rgba(0, 0, 0, 0.2)',
            'color-focus': 'rgba(92, 184, 92, 0.4)',
            'color-error': 'red',
            'color-fg-muted': '#aaa'
        };

        const cssVars = [
            { name: 'color-bg', label: 'Background Color' },
            { name: 'color-fg', label: 'Text Color' },
            { name: 'color-primary', label: 'Primary Color' },
            { name: 'color-primary-hover', label: 'Primary Hover Color' },
            { name: 'color-card-bg', label: 'Card Background Color' },
            { name: 'color-link', label: 'Link Color' },
            { name: 'color-link-hover', label: 'Link Hover Color' },
            { name: 'color-button-bg', label: 'Button Background Color' },
            { name: 'color-button-hover', label: 'Button Hover Color' },
            { name: 'color-button-text-hover', label: 'Button Text Hover Color' },
            { name: 'color-border', label: 'Border Color' },
            { name: 'color-input-bg', label: 'Input Background Color' },
            { name: 'color-shadow', label: 'Shadow Color' },
            { name: 'color-inset-shadow', label: 'Inset Shadow Color' },
            { name: 'color-focus', label: 'Focus Color' },
            { name: 'color-error', label: 'Error Color' },
            { name: 'color-fg-muted', label: 'Muted Text Color' }
        ];

        const themes = {
            dark: '/styles/style-dark.css',
            light: '/styles/style-light.css',
            pastel: '/styles/style-pastel.css',
            purple: '/styles/style-purple.css',
            blue: '/styles/style-blue.css',
            orange: '/styles/style-orange.css',
            green: '/styles/style-green.css'
        };

        function createColorPicker(varName, label) {
            const container = document.createElement('div');
            container.className = 'color-picker';
            
            const labelElement = document.createElement('label');
            labelElement.textContent = label;
            
            const pickrContainer = document.createElement('div');
            pickrContainer.id = `${varName}-pickr`;
            
            const textInput = document.createElement('input');
            textInput.type = 'text';
            textInput.id = `${varName}-text`;

            // Add preview section based on the variable
            const preview = document.createElement('div');
            preview.className = 'preview';
            
            switch(varName) {
                case 'color-bg':
                    preview.style.backgroundColor = 'var(--color-bg)';
                    preview.innerHTML = '<div class="preview-text">Background Color</div>';
                    break;
                case 'color-fg':
                    preview.innerHTML = '<div class="preview-text">Text Color</div>';
                    break;
                case 'color-primary':
                    preview.innerHTML = '<div class="preview-text" style="color: var(--color-primary)">Primary Color</div>';
                    break;
                case 'color-primary-hover':
                    preview.innerHTML = '<div class="preview-text" style="color: var(--color-primary-hover)">Primary Hover Color</div>';
                    break;
                case 'color-card-bg':
                    preview.innerHTML = '<div class="preview-card">Card Background</div>';
                    break;
                case 'color-link':
                case 'color-link-hover':
                    preview.innerHTML = '<a class="preview-link" href="#">Link Example</a>';
                    break;
                case 'color-button-bg':
                case 'color-button-hover':
                case 'color-button-text-hover':
                    preview.innerHTML = '<button class="preview-button">Button Example</button>';
                    break;
                case 'color-border':
                    preview.style.border = '2px solid var(--color-border)';
                    preview.innerHTML = '<div class="preview-text">Border Color</div>';
                    break;
                case 'color-input-bg':
                    preview.innerHTML = '<input class="preview-input" type="text" placeholder="Input Background">';
                    break;
                case 'color-shadow':
                    preview.style.boxShadow = '0 4px 8px var(--color-shadow)';
                    preview.innerHTML = '<div class="preview-text">Shadow Color</div>';
                    break;
                case 'color-inset-shadow':
                    preview.style.boxShadow = 'inset 0 2px 4px var(--color-inset-shadow)';
                    preview.innerHTML = '<div class="preview-text">Inset Shadow Color</div>';
                    break;
                case 'color-focus':
                    preview.innerHTML = '<input class="preview-input" type="text" placeholder="Focus Color (click to see)">';
                    break;
                case 'color-error':
                    preview.innerHTML = '<div class="preview-error">Error Text Example</div>';
                    break;
                case 'color-fg-muted':
                    preview.innerHTML = '<div class="preview-muted">Muted Text Example</div>';
                    break;
            }
            
            container.appendChild(labelElement);
            container.appendChild(pickrContainer);
            container.appendChild(textInput);
            container.appendChild(preview);
            
            return container;
        }

        let pickrInstances = {};

        function initializeColorPickers() {
            const container = document.getElementById('colorPickers');
            
            cssVars.forEach(({ name, label }) => {
                container.appendChild(createColorPicker(name, label));
            });
            
            // Load saved values
            const savedTheme = JSON.parse(localStorage.getItem('customTheme') || '{}');
            const currentTheme = localStorage.getItem('theme') || 'dark';
            
            cssVars.forEach(({ name }) => {
                const textInput = document.getElementById(`${name}-text`);
                let savedValue;
                
                if (currentTheme === 'custom' && savedTheme[name]) {
                    // Use saved custom theme value
                    savedValue = savedTheme[name];
                } else {
                    // Use default theme value
                    savedValue = defaultTheme[name];
                }
                
                // Initialize Pickr
                pickrInstances[name] = Pickr.create({
                    el: `#${name}-pickr`,
                    theme: 'classic',
                    default: savedValue,
                    components: {
                        preview: true,
                        opacity: true,
                        hue: true,
                        interaction: {
                            hex: true,
                            rgba: true,
                            hsla: true,
                            input: true,
                            clear: false,
                            save: true
                        }
                    }
                });

                // Set initial values
                textInput.value = savedValue;
                document.documentElement.style.setProperty(`--${name}`, savedValue);
                
                // Update text input when color changes
                pickrInstances[name].on('change', (color) => {
                    const hexColor = color.toHEXA().toString();
                    textInput.value = hexColor;
                    document.documentElement.style.setProperty(`--${name}`, hexColor);
                });
                
                // Update picker when text input changes
                textInput.addEventListener('input', (e) => {
                    const newColor = e.target.value;
                    if (/^#[0-9A-F]{6}$/i.test(newColor)) {
                        pickrInstances[name].setColor(newColor);
                        document.documentElement.style.setProperty(`--${name}`, newColor);
                    }
                });
            });
        }

        function saveCustomTheme() {
            const theme = {};
            cssVars.forEach(({ name }) => {
                theme[name] = document.getElementById(`${name}-text`).value;
            });
            localStorage.setItem('customTheme', JSON.stringify(theme));
            localStorage.setItem('theme', 'custom');
            alert('Theme saved successfully!');
        }

        async function loadThemeFromCSS(cssFile) {
            try {
                const response = await fetch(cssFile);
                const cssText = await response.text();
                
                // Extract CSS variables from the file
                const cssVars = {};
                const varRegex = /--([^:]+):\s*([^;]+);/g;
                let match;
                
                while ((match = varRegex.exec(cssText)) !== null) {
                    const [, name, value] = match;
                    cssVars[name] = value.trim();
                }
                
                return cssVars;
            } catch (error) {
                console.error('Error loading theme:', error);
                return null;
            }
        }

        async function loadPresetTheme() {
            const presetSelect = document.getElementById('presetSelect');
            const selectedTheme = presetSelect.value;
            
            if (!selectedTheme) return;
            
            if (confirm('This will overwrite your current theme settings. Continue?')) {
                const cssFile = themes[selectedTheme];
                const themeVars = await loadThemeFromCSS(cssFile);
                
                if (themeVars) {
                    cssVars.forEach(({ name }) => {
                        const textInput = document.getElementById(`${name}-text`);
                        const newColor = themeVars[name] || defaultTheme[name];
                        
                        textInput.value = newColor;
                        pickrInstances[name].setColor(newColor);
                        document.documentElement.style.setProperty(`--${name}`, newColor);
                    });
                } else {
                    alert('Error loading theme. Using default theme instead.');
                    resetTheme();
                }
                
                // Reset the select to show placeholder
                presetSelect.value = '';
            }
        }

        function resetTheme() {
            if (confirm('Are you sure you want to reset the theme to default values?')) {
                cssVars.forEach(({ name }) => {
                    const textInput = document.getElementById(`${name}-text`);
                    const defaultValue = defaultTheme[name];
                    
                    textInput.value = defaultValue;
                    pickrInstances[name].setColor(defaultValue);
                    document.documentElement.style.setProperty(`--${name}`, defaultValue);
                });
                
                localStorage.removeItem('customTheme');
                localStorage.setItem('theme', 'dark');
                alert('Theme has been reset to default values!');
            }
        }

        function exportCSS() {
            const cssVars = {};
            document.querySelectorAll('.color-picker input[type="text"]').forEach(input => {
                const varName = input.id.replace('-text', '');
                cssVars[varName] = input.value;
            });

            const css = `:root {\n${Object.entries(cssVars)
                .map(([name, value]) => `    --${name}: ${value};`)
                .join('\n')}\n}`;

            navigator.clipboard.writeText(css).then(() => {
                const tooltip = document.getElementById('exportTooltip');
                tooltip.classList.add('visible');
                setTimeout(() => {
                    tooltip.classList.remove('visible');
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeColorPickers();
        });
    </script>
</body>
</html>
